<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#111111">
  <title>DBK Stage</title>
  <style>
    :root {
      --bg: #111;
      --row: #1c1c1c;
      --text: #eee;
      --muted: #9a9a9a;
      --line: #2c2c2c;
      --selected: #1d4f91;
      --stop: #c62828;
      --stop-on: #e53935;
      --play: #2e7d32;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @supports (height: 100dvh) {
      html, body { height: 100dvh; }
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    header {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: #161616;
      border-bottom: 1px solid var(--line);
    }
    .top-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      min-width: 0;
    }
    #play, #setlist, #mixer {
      height: 52px;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      touch-action: manipulation;
    }
    #setlist, #mixer {
      flex: 0 0 auto;
      width: 52px;
      padding: 0;
      border: 1px solid #444;
      background: var(--row);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #setlist.on, #mixer.on {
      background: var(--selected);
      border-color: transparent;
      color: #fff;
    }
    #mixer[hidden] { display: none; }
    #setlist svg, #mixer svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #setlist svg [data-fill], #mixer svg [data-fill] { fill: currentColor; stroke: none; }
    #outputs {
      flex: 0 0 152px;
      width: 152px;
      min-width: 0;
      height: 52px;
      padding: 0 6px;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      font: inherit;
      font-weight: 700;
    }
    #play {
      flex: 0 0 auto;
      width: 52px;
      padding: 0;
      border: 0;
      background: #2a2a2a;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #play svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }
    #play[hidden],
    #play svg[hidden] { display: none; }
    #play.on { background: var(--play); color: #fff; }
    .transport[hidden] { display: none; }
    .transport {
      display: flex;
      gap: 8px;
      width: 100%;
      height: 52px;
    }
    .track {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 52px;
      overflow: hidden;
      border-radius: 8px;
      background: #1a1a1a;
    }
    .sections { position: absolute; inset: 0; }
    .sec {
      position: absolute;
      top: 0;
      bottom: 0;
      min-width: 2px;
      box-sizing: border-box;
      border-radius: 8px;
      overflow: hidden;
      padding: 0 3px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 10px;
      font-weight: 700;
      line-height: 52px;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .sec.tone-default { background: rgba(47, 111, 237, 0.35); }
    .sec.tone-count { background: rgba(230, 193, 74, 0.45); color: #1a1a1a; }
    .sec.tone-serbest { background: rgba(139, 92, 246, 0.4); }
    .sec.tone-song { background: rgba(61, 186, 122, 0.4); }
    .sec.tone-rall { background: rgba(232, 193, 42, 0.55); color: #1a1a1a; z-index: 1; }
    .sec.tone-final { background: rgba(226, 74, 74, 0.45); z-index: 1; }
    .head {
      display: none;
      position: absolute;
      top: 4px;
      bottom: 4px;
      z-index: 2;
      box-sizing: border-box;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }
    .measure {
      display: none;
      position: absolute;
      z-index: 4;
      top: 0;
      bottom: 0;
      background: #00e5ff;
      pointer-events: none;
    }
    .slider {
      position: absolute;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      appearance: none;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }
    .slider::-webkit-slider-runnable-track { height: 100%; background: transparent; }
    .slider::-webkit-slider-thumb {
      width: 28px;
      height: 100%;
      appearance: none;
      border: 0;
      background: transparent;
    }
    .slider::-moz-range-track { height: 100%; border: 0; background: transparent; }
    .slider::-moz-range-thumb { width: 28px; height: 100%; border: 0; background: transparent; }
    .slider:disabled { cursor: default; }
    button:disabled { opacity: 0.4; }
    #columns {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    #list[hidden], #stage-col[hidden], #prep[hidden] { display: none; }
    #prep {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .prep-panel {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .prep-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      display: grid;
      grid-template-columns:
        40px
        minmax(10rem, 2.55fr)
        max-content
        max-content
        max-content
        max-content
        max-content
        max-content
        max-content
        max-content
        max-content;
      column-gap: 14px;
      row-gap: 6px;
      align-items: start;
      grid-auto-rows: min-content;
      padding: 0 12px 16px;
    }
    .prep-block {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      margin: 0;
      touch-action: manipulation;
    }
    .prep-list.is-reordering { cursor: grabbing; }
    .prep-block.dragging { opacity: 0.72; }
    .prep-cols {
      display: grid;
      grid-template-columns: subgrid;
      grid-column: 1 / -1;
      align-items: center;
    }
    .prep-head-block {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      grid-column: 1 / -1;
      background: transparent;
    }
    .prep-manage {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 6px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      color: var(--text);
    }
    .prep-setlist-name {
      flex: 1 1 14rem;
      max-width: 22rem;
      min-width: 8rem;
      height: 36px;
      margin: 0;
      padding: 0 8px;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .prep-manage-act {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    .prep-manage-act svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: currentColor;
    }
    .prep-manage-act:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .prep-manage-act.delete { color: #ff8a80; }
    .prep-stats {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 6px 8px;
      color: #000;
      font-size: 0.82rem;
      font-weight: 400;
      line-height: 1;
    }
    .prep-stats::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      bottom: 0;
      left: -12px;
      right: -12px;
      background: #ffff00;
      border-bottom: 1px solid #000;
    }
    .prep-stats .prep-stat-total,
    .prep-stats .prep-stat-form {
      display: inline-flex;
      align-items: center;
    }
    .prep-stats .prep-stat-total { font-weight: 750; }
    .prep-stat-dot {
      display: inline-block;
      font-size: 0.42em;
      line-height: 1;
      margin: 0 0.35em;
    }
    .prep-stats .prep-stat-form {
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid #000;
      font-weight: 400;
    }
    .prep-song-row, .prep-elif-row, .prep-final {
      height: 50px;
      min-height: 50px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--row);
    }
    .prep-block.active .prep-song-row,
    .prep-block.active .prep-elif-row {
      background: var(--selected);
      border-color: transparent;
    }
    .prep-block.skipped .prep-song-row,
    .prep-block.skipped.active .prep-song-row {
      background: #4a4a4a;
      color: #d0d0d0;
      border-color: transparent;
    }
    .prep-block[data-k="stop"] .prep-elif-row,
    .prep-block[data-k="stopadd"] .prep-elif-row {
      background: var(--stop);
      color: #fff;
      border-color: transparent;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .prep-block.active[data-k="stop"] .prep-elif-row {
      background: var(--stop-on);
      border-color: transparent;
    }
    .prep-block.skipped[data-k="stop"] .prep-elif-row,
    .prep-block.skipped.active[data-k="stop"] .prep-elif-row {
      background: #4a4a4a;
      color: #d0d0d0;
    }
    .prep-block.active[data-k="song"] .prep-song-row,
    .prep-block.skipped.active[data-k="song"] .prep-song-row {
      background: #ea8400;
      color: #000;
      border-color: transparent;
    }
    .prep-block.active[data-k="song"] .prep-cell.time { opacity: 1; }
    .prep-final {
      margin: 0;
      background: #ff4d94;
      color: #111;
      border-color: transparent;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .prep-cell.num { padding-left: 8px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
    .prep-cell.title, .prep-val {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prep-cell.title { font-weight: 700; }
    .prep-val { font-size: 0.78rem; font-weight: 650; }
    .prep-elif-row .prep-cell.title { grid-column: 2 / 11; }
    .prep-final .prep-cell.title { grid-column: 2 / -1; }
    .prep-acts {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      align-items: center;
      padding-right: 8px;
    }
    .prep-act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1.5px solid currentColor;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1;
    }
    .prep-act.prep-count {
      flex: 0 0 auto;
      width: auto;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .prep-act.prep-count.on {
      background: var(--selected);
      border-color: transparent;
      color: #fff;
    }
    .prep-act.prep-count:disabled { opacity: 1; color: var(--muted); }
    .prep-act.skip svg, .side.skip svg {
      width: 22px;
      height: 15px;
      display: block;
      flex: 0 0 auto;
    }
    .prep-lib-title {
      grid-column: 1 / -1;
      margin: 8px 4px 2px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .prep-act.prep-count:not(:disabled) { cursor: pointer; }
    #stage-col {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    #pages {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
    }
    #pages button {
      flex: 0 0 auto;
      width: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 0;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      font: inherit;
      touch-action: manipulation;
    }
    #page-edit[hidden], #page-prep[hidden] { display: none; }
    #pages button.on {
      background: var(--selected);
      border-color: transparent;
    }
    #pages svg {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #pages svg [data-fill] { fill: currentColor; stroke: none; }
    #view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
    }
    .empty {
      margin: 8px 0;
      color: var(--muted);
    }
    .song-block { margin: 0 0 28px; }
    .song-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      margin: 0 0 14px;
      padding: 0 10px;
      border-radius: 8px;
      background: #ea8400;
      color: #111;
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: 0.04em;
    }
    .song-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .song-meta {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      margin-left: auto;
      font-size: 0.82em;
      font-weight: 650;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .song-meta-dot {
      width: 0.38em;
      height: 0.38em;
      margin: 0 0.5em;
      border-radius: 50%;
      background: currentColor;
      flex: 0 0 auto;
    }
    .song-head .song-title { margin-bottom: 0; }
    .song-title.stop-title {
      margin-top: 14px;
      background: #c62828;
      color: #fff;
    }
    .song-title.stop-title.selected { box-shadow: inset 0 0 0 2px #fff; }
    .song-note {
      display: block;
      width: 100%;
      height: 22px;
      min-height: 22px;
      margin: 8px 0 14px;
      padding: 0 10px;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #1a1a1a;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 750;
      line-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .song-note.has-note {
      background: #ea8400;
      border-color: #ea8400;
      color: #111;
      caret-color: #111;
    }
    .song-note[hidden] { display: none; }
    #lyrics-stage .song-head:has(.song-note[hidden]) + .lyric-section,
    #lyrics-stage .song-head:has(.song-note[hidden]) + .lyric-line,
    #chords-stage .song-head:has(.song-note[hidden]) + .chord-list,
    #drums-stage .song-head:has(.song-note[hidden]) + .drum-list,
    #score-stage .song-head:has(.song-note[hidden]) + .nota-count-stack {
      margin-top: 14px;
    }
    .nota-count-stack { margin: 0 0 10px; }
    .lyric-section.nota-count-bar { width: 100%; margin-bottom: 0; }
    .score-pages {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .score-page-wrap { position: relative; width: 100%; }
    .score-overlay { position: absolute; inset: 0; }
    .score-rect {
      position: absolute;
      box-sizing: border-box;
    }
    .score-rect.bar { pointer-events: none; }
    .score-rect.bar.current {
      background: rgba(61, 186, 122, 0.28);
      border: 1px solid rgb(61, 186, 122);
    }
    .score-rect.bar.next { background: rgba(232, 145, 48, 0.28); }
    .score-editing .song-block[data-current="1"] .score-rect.bar.section-mate {
      z-index: 1;
      border: 0;
      background: rgba(232, 80, 160, 0.1);
      pointer-events: auto;
      cursor: pointer;
    }
    .score-editing .song-block[data-current="1"] .score-rect.bar.selected {
      pointer-events: auto;
      touch-action: none;
      z-index: 3;
      border: 1px solid rgb(61, 186, 122);
      background: rgba(61, 186, 122, 0.28);
      box-shadow: 0 0 0 1px #fff;
    }
    .score-rect.label {
      z-index: 4;
      display: inline-flex;
      align-items: center;
      width: max-content;
      max-width: 40%;
      height: auto;
      padding: calc(2px * var(--score-scale, 1)) calc(7px * var(--score-scale, 1));
      box-sizing: border-box;
      border-radius: calc(3px * var(--score-scale, 1));
      color: #fff;
      font-size: calc(13px * var(--score-scale, 1));
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    .score-editing .song-block[data-current="1"] .score-rect.label {
      pointer-events: auto;
      cursor: grab;
    }
    .score-editing .score-rect.label.selected { box-shadow: 0 0 0 2px #fff; z-index: 7; }
    .score-rect.label.tone-default { background: #2f6fed; }
    .score-rect.label.tone-count { background: #e6c14a; color: #1a1a1a; }
    .score-rect.label.tone-serbest { background: #8b5cf6; }
    .score-rect.label.tone-song { background: #3dba7a; }
    .score-rect.label.tone-rall { background: #e8c12a; color: #1a1a1a; }
    .score-rect.label.tone-final { background: #e24a4a; }
    .score-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border: 1px solid rgb(61, 186, 122);
      border-radius: 1px;
      box-sizing: border-box;
      touch-action: none;
    }
    #score-stage:not(.score-editing) .score-handle { display: none; }
    .score-handle.n, .score-handle.s { left: 50%; margin-left: -5px; cursor: ns-resize; }
    .score-handle.e, .score-handle.w { top: 50%; margin-top: -5px; cursor: ew-resize; }
    .score-handle.n { top: -5px; }
    .score-handle.s { bottom: -5px; }
    .score-handle.e { right: -5px; }
    .score-handle.w { left: -5px; }
    .score-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
    .score-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .score-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
    .score-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    #score-edit[hidden] { display: none; }
    #score-edit {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #161616;
      border-bottom: 1px solid var(--line);
    }
    #score-edit select, #score-edit button {
      height: 40px;
      border: 1px solid #444;
      border-radius: 8px;
      background: var(--row);
      color: var(--text);
      font: inherit;
      font-weight: 700;
    }
    #edit-section { flex: 0 0 8rem; width: 8rem; max-width: 8rem; }
    #edit-measure { flex: 0 0 5.5rem; width: 5.5rem; max-width: 5.5rem; }
    #score-edit button { width: 44px; touch-action: manipulation; padding: 0; }
    #score-edit button svg { width: 22px; height: 22px; display: block; margin: 0 auto; }
    #edit-chain svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #edit-chain.on { background: var(--selected); border-color: transparent; color: #fff; }
    #edit-clear { margin-left: auto; color: #ff8a80; }
    #edit-clear svg { fill: currentColor; }
    .lyric-line, .lyric-section {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      margin: 0 0 14px;
    }
    .lyric-line {
      font-size: 1.35rem;
      font-weight: 750;
      line-height: 1.25;
    }
    .lyric-section {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      height: 22px;
      min-height: 22px;
      padding: 0 10px;
      color: #fff;

  <script>
    var meta = null;
    var rows = [];
    var outputTracks = [];

    var lyricRows = [];
    var lyricCurrent = -2;
    var chordKey = "";
    var chordMark = "";
    var drumKey = "";
    var drumMark = "";
    var chartToken = 0;
    var stageCharts = null;
    var scoreNames = "";
    var scoreDocs = {};
    var scoreLoads = {};
    var scoreStamps = {};
    var scoreCheckAt = 0;
    var scoreCheckBusy = false;
    var settingsCache = {};
    var scoreRects = {};
    var scoreEdit = false;
    var scoreSelected = "";
    var scoreDrag = null;
    var editSectionIndex = 0;
    var editMeasure = 1;
    var selectedLabelId = "";
    var scoreJob = 0;
    var scoreWidth = 0;
    var scoreLoading = "";
    var pdfjsPromise = null;

    function parseJson(raw) {
      if (!raw) return null;
      try { return JSON.parse(raw); } catch (err) { return null; }
    }

    function send(action, guid) {
      var value = action;
      if (guid != null && guid !== "") value += "|" + guid;
      wwr_req("SET/EXTSTATE/DBK_STAGE/cmd/" + encodeURIComponent(value));
    }

    function selectionGuid() {
      if (practiceMode) return practiceSel || "";
      return meta && meta.sel ? meta.sel : "";
    }

    function canSelectSong(guid) {
      if (!stagePlaying()) return true;
      return !!guid && guid === selectionGuid();
    }

    function selectedSongRow() {
      var guid = selectionGuid();
      if (!guid) return null;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].k === "song" && rows[i].g === guid) return rows[i];
      }
      return null;
    }

    function stagePair() {
      var songs = [];
      var selectedAt = -1;
      var sel = selectionGuid();
      var i;
      for (i = 0; i < rows.length; i++) {
        if (rows[i].k !== "song") continue;
        if (sel && rows[i].g === sel) selectedAt = songs.length;
        songs.push(rows[i]);
      }
      if (selectedAt < 0) return [];
      var selected = songs[selectedAt];
      var inSet = selected.set ? 1 : 0;
      var next = null;
      for (i = selectedAt + 1; i < songs.length; i++) {
        if (songs[i].s) continue;
        if ((songs[i].set ? 1 : 0) === inSet) {
          next = songs[i];
          break;
        }
      }
      return next ? [selected, next] : [selected];
    }

    function sectionTone(name) {
      var n = String(name || "");
      try { n = n.toLocaleUpperCase("tr-TR"); } catch (err) { n = n.toUpperCase(); }
      function named(token) {
        if (n === token || n.indexOf(token + " ") === 0) return true;
        var parts = n.split(/[^A-Z0-9]+/);
        for (var i = 0; i < parts.length; i++) {
          if (parts[i] === token) return true;
        }
        return false;
      }
      if (named("COUNT")) return "count";
      if (named("SERBEST")) return "serbest";
      if (named("SAN") || named("NAK")) return "song";
      if (named("RALL")) return "rall";
      if (named("FINAL")) return "final";
      return "default";
    }

    function rallTransportSection(data, formEnd) {
      var start = firstTempoChangeTime(data && data.tempoMap);
      if (start == null) return null;
      return { name: "RALL", start: start, end: Math.max(start, formEnd) };
    }

    function finalTransportSection(data, formEnd) {
      var start = data && Number(data.finalAt);
      if (!data || !isFinite(start)) return null;
      var ownerEnd = finalOwnerEnd(data);
      return { name: "FINAL", start: start, end: Math.max(start, ownerEnd == null ? formEnd : ownerEnd) };
    }

    function buildTransport(data, hideCount) {
      var list = [];
      var end = 0;
      var src = (data && data.sections) || [];
      for (var i = 0; i < src.length; i++) {
        if (hideCount && cueNameIs(src[i].name, "COUNT")) continue;
        var start = Number(src[i].start) || 0;
        var finish = Number(src[i].end);
        if (!(finish > start)) finish = start;
        list.push({ name: src[i].name || "", start: start, end: finish });
        if (finish > end) end = finish;
      }
      var cues = cueKinds(data);
      for (var c = 0; c < cues.length; c++) {
        var extra = cues[c] === "rall" ? rallTransportSection(data, end) : finalTransportSection(data, end);
        if (!extra) continue;
        var duplicate = false;
        for (var s = 0; s < list.length; s++) {
          if (list[s].name === extra.name && Math.abs(list[s].start - extra.start) < 0.02) duplicate = true;
        }
        if (duplicate) continue;
        list.push(extra);
        if (extra.end > end) end = extra.end;
      }
      return { list: list, end: end };
    }

    function sectionContaining(list, time) {
      var hit = null;
      for (var i = 0; i < list.length; i++) {
        var section = list[i];
        // Song starts are published to the millisecond, so a seek to this
        // section can report a playhead a fraction early. Treat that as here.
        if (time >= section.start - 0.001 && time < section.end - 0.0005) hit = section;
      }
      return hit;
    }

    function sectionStartAt(list, time) {
      var hit = null;
      for (var i = 0; i < list.length; i++) {
        var section = list[i];
        if (time >= section.start - 1e-9 && time <= section.end + 1e-9) hit = section;
      }
      if (hit) return hit.start;
      for (var j = list.length - 1; j >= 0; j--) {
        if (time >= list[j].start) return list[j].start;
      }
      return 0;
    }

    function sectionStartFromPointer(list, clientX) {
      var blocks = document.getElementById("sections").children;
      var i;
      for (i = 0; i < blocks.length && i < list.length; i++) {
        var rect = blocks[i].getBoundingClientRect();
        // The painted block is 2px shorter than its time span, so the gutter
        // just left of a block still belongs to the previous section's time.
        if (clientX >= rect.left - 2 && clientX <= rect.right) return list[i].start;
      }
      var host = document.getElementById("slider").getBoundingClientRect();
      var t = (clientX - host.left) / Math.max(1, host.width);
      if (t < 0) t = 0;
      if (t > 1) t = 1;
      return sectionStartAt(list, t * transportInfo.end);
    }

    function webFile(name) {
      var text = String(name || "");
      try { text = text.normalize("NFD"); } catch (err) {}
      text = text.replace(/[\u0300-\u036f]/g, "");
      text = text.replace(/\u0131/g, "i").replace(/\u0130/g, "I");
      var safe = text.replace(/[^A-Za-z0-9._-]+/g, "-").replace(/-+/g, "-").replace(/^-+|-+$/g, "");
      return safe || "song";
    }

    function applyCachedSong(name) {
      var cached = fileCache[name];
      if (songFileName !== name || !cached || !cached.settled) return;
      songFile = cached.data;
      songFileSettled = true;
    }

    function requestSongFile(name, primary, refresh) {
      if (!name) {
        if (primary) {
          songFile = null;
          songFileName = "";
          songFileSettled = false;
        }
        return;
      }
      var cached = fileCache[name];
      if (cached && cached.pending) {
        if (primary) songFileName = name;
        return;
      }
      if (cached && cached.settled && !refresh) {
        if (primary) {
          songFileName = name;
          applyCachedSong(name);
        }
        return;
      }
      if (refresh && cached && cached.fetchedAt && Date.now() - cached.fetchedAt < 3000) {
        if (primary) {
          songFileName = name;
          applyCachedSong(name);
        }
        return;
      }
      if (primary) songFileName = name;
      if (primary && (!cached || !cached.data)) {
        songFile = null;
        songFileSettled = false;
      }
      if (!cached) fileCache[name] = { data: null, settled: false, pending: true };
      else cached.pending = true;
      fetch("DBK_Stage/" + webFile(name) + ".json", { cache: "no-store" }).then(function(response) {
        return response.ok ? response.json() : null;
      }).then(function(data) {
        fileCache[name] = { data: data, settled: true, pending: false, fetchedAt: Date.now() };
        fillLibraryKeys();
        if (songFileName === name) {
          applyCachedSong(name);
          renderTransport();
        }
        refreshViews();
        if (viewPage === "prep") renderPrep();
      }).catch(function() {
        var prev = fileCache[name];
        fileCache[name] = { data: prev && prev.data || null, settled: true, pending: false, fetchedAt: Date.now() };
        if (songFileName === name) {
          applyCachedSong(name);
          renderTransport();
        }
        refreshViews();
        if (viewPage === "prep") renderPrep();
      });
    }

    function loadSongFile(name) {
      requestSongFile(name, true);
    }

    function transportEditable() {
      if (practiceMode) return true;
      return liveNow() && selectedOutputName() === "MEHMETHAN";
    }

    function renderTransport() {
      var box = document.getElementById("transport");
      var host = document.getElementById("sections");
      var slider = document.getElementById("slider");
      var live = liveNow() || practiceMode;
      var song = selectedSongRow();
      box.hidden = !live;
      if (!live || !song) {
        transportInfo = null;
        transportKey = "";
        host.innerHTML = "";
        slider.disabled = true;
        updateHead();
        return;
      }
      if (song.n !== songFileName) loadSongFile(song.n);
      transportInfo = buildTransport(songFile, countIsOff(song));
      var key = song.n + "|" + (songFile ? JSON.stringify(transportInfo.list) : "");
      slider.disabled = !transportEditable() || !songFile || transportInfo.end <= 0;
      slider.max = String(transportInfo.end || 1);
      if (key === transportKey) {
        updateHead();
        return;
      }
      transportKey = key;
      host.innerHTML = "";
      var length = Math.max(0.001, transportInfo.end);
      for (var i = 0; i < transportInfo.list.length; i++) {
        var section = transportInfo.list[i];
        var block = document.createElement("span");
        block.className = "sec tone-" + sectionTone(section.name);
        block.style.left = ((section.start / length) * 100) + "%";
        block.style.width = "calc(" + (((section.end - section.start) / length) * 100) + "% - 2px)";
        block.textContent = section.name;
        host.appendChild(block);
      }
      updateHead();
    }

    function timeToMusical(map, time) {
      var points = map && map.length ? map : [{ time: 0, measure: 1, bpm: 120, numerator: 4, denominator: 4 }];
      var t = Math.max(0, time);
      var active = points[0];
      var i;
      for (i = 0; i < points.length; i++) {
        var next = points[i + 1];
        if (next && t >= next.time) {
          active = next;
          continue;
        }
        active = points[i];
        break;
      }
      var numerator = 4;
      var denominator = 4;
      for (i = 0; i < points.length; i++) {
        if (points[i].time > active.time + 1e-9) break;
        if (points[i].numerator > 0 && points[i].denominator > 0) {
          numerator = points[i].numerator;
          denominator = points[i].denominator;
        }
      }
      if (active.numerator > 0) numerator = active.numerator;
      if (active.denominator > 0) denominator = active.denominator;
      var bpm = Number(active.bpm) || 120;
      var measureLen = numerator * (60 / bpm) * (4 / denominator);
      if (!(measureLen > 0)) return { measure: active.measure || 1, beat: 1, start: t, end: t };
      var origin = Number(active.time || 0);
      var elapsed = t - origin;
      // A section start sits on a barline, but the bar length is a repeating
      // fraction, so elapsed/measureLen can be 1e-7 under the integer. Floor
      // then draws that bar in the previous section.
      var whole = Math.floor(elapsed / measureLen + 1e-4);
      var beat = 1 + (elapsed - whole * measureLen) / (measureLen / numerator);
      var barStart = origin + whole * measureLen;
      return {
        measure: (Number(active.measure) || 1) + whole,
        beat: Math.min(numerator + 0.999, Math.max(1, beat)),
        start: barStart,
        end: barStart + measureLen
      };
    }

    function measureRangeFill(map, start, end, time) {
      if (time < start - 1e-6) return 0;
      if (time >= end - 1e-6) return 1;
      var startMeasure = timeToMusical(map, start).measure;
      var last = Math.max(start, end - 0.02);
      var endMeasure = timeToMusical(map, last).measure;
      var currentMeasure = timeToMusical(map, Math.min(Math.max(time, start), last)).measure;
      var total = Math.max(1, endMeasure - startMeasure + 1);
      var number = Math.min(total, Math.max(1, currentMeasure - startMeasure + 1));
      return number / total;
    }

    function updateHead() {
      var head = document.getElementById("head");
      var measure = document.getElementById("measure");
      var song = selectedSongRow();
      if (!transportInfo || !song || !(transportInfo.end > 0)) {
        head.style.display = "none";
        measure.style.display = "none";
        return;
      }
      var off = songOffset();
      if (off == null) off = 0;
      if (off < -0.05 || off > transportInfo.end + 0.05) {
        head.style.display = "none";
        measure.style.display = "none";
        return;
      }
      if (off < 0) off = 0;
      if (off > transportInfo.end) off = transportInfo.end;
      var hit = sectionContaining(transportInfo.list, off);
      var start = hit ? hit.start : off;
      var finish = hit ? hit.end : Math.min(transportInfo.end, off + 0.5);
      var length = Math.max(0.001, transportInfo.end);
      head.style.display = "block";
      head.style.left = ((start / length) * 100) + "%";
      head.style.width = ((Math.max(0.02, finish - start) / length) * 100) + "%";
      if (!songFile || songFileName !== song.n) {
        measure.style.display = "none";
        return;
      }
      var bar = timeToMusical(songFile.tempoMap, hit ? Math.max(off, hit.start) : off);
      var barStart = Math.max(0, bar.start);
      var barEnd = Math.min(transportInfo.end, bar.end);
      if (!(barEnd > barStart)) barEnd = Math.min(transportInfo.end, barStart + 0.02);
      measure.textContent = "";
      measure.style.display = "block";
      measure.style.left = ((barStart / length) * 100) + "%";
      measure.style.width = (((barEnd - barStart) / length) * 100) + "%";
    }

    function countTrim(song) {
      var seconds = Number(song && song.c);
      return seconds > 0 ? seconds : 0;
    }

    function countIsOff(song) {
      return countTrim(song) > 0;
    }

    function countOffMark() {
      var mark = document.createElement("span");
      mark.className = "count-off-mark";
      mark.setAttribute("aria-hidden", "true");
      return mark;
    }

    function songOffset() {
      var song = selectedSongRow();
      if (!song) return null;
      if (practiceMode) {
        var t = practiceAudioTime();
        if (t < 0) t = 0;
        return t;
      }
      return playPos - (Number(song.p) || 0) + countTrim(song);
    }

    function practiceAudioTime() {
      if (!practicePlaying || !practiceCtx) return practiceOffset;
      return practiceOffset + (practiceCtx.currentTime - practiceStartAt);
    }

    function stopPracticeAudio() {
      if (practicePlaying) practiceOffset = practiceAudioTime();
      if (practiceSource) {
        try { practiceSource.onended = null; practiceSource.stop(); } catch (err) {}
        try { practiceSource.disconnect(); } catch (err2) {}
        practiceSource = null;
      }
      practicePlaying = false;
    }

    function ensurePracticeCtx() {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!practiceCtx) practiceCtx = new AC();
      if (practiceCtx.state === "suspended") practiceCtx.resume();
      return practiceCtx;
    }

    function loadPracticeSong(name) {
      if (!name) return Promise.reject(new Error("song"));
      if (practiceBuffers[name]) return Promise.resolve(practiceBuffers[name]);
      if (practiceLoading[name]) return practiceLoading[name];
      var pending = fetch("DBK_Stage/" + webFile(name) + ".mp3").then(function(res) {
        if (!res.ok) throw new Error("mp3");
        return res.arrayBuffer();
      }).then(function(bytes) {
        var ctx = ensurePracticeCtx();
        if (!ctx) throw new Error("audio");
        return ctx.decodeAudioData(bytes.slice(0));
      }).then(function(buffer) {
        practiceBuffers[name] = buffer;
        delete practiceLoading[name];
        return buffer;
      }, function(err) {
        delete practiceLoading[name];
        throw err;
      });
      practiceLoading[name] = pending;
      return pending;
    }

    function practiceNextSong(song) {
      if (!song) return null;
      var found = false;
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        if (row.k !== "song" || !row.set) continue;
        if (found) {
          if (!row.s) return row;
        } else if (row.g === song.g) found = true;
      }
      return null;
    }

    function practiceStops(song) {
      if (!song || !song.set || song.s || !practiceNextSong(song)) return true;
      return songHasStop(song.g);
    }

    function practiceSongStart(song) {
      return countIsOff(song) ? countTrim(song) : 0;
    }

    function practiceNextAt(song) {
      var cached = song && fileCache[song.n];
      if (!cached || !cached.settled || !cached.data) return 0;
      var at = Number(cached.data.nextSongAt);
      return at > 0 ? at : 0;
    }

    function finishPracticeAtStop(song) {
      stopPracticeAudio();
      practiceChain = false;
      var next = practiceNextSong(song);
      if (!next) {
        paint();
        return;
      }
      practiceSel = next.g;
      practiceOffset = practiceSongStart(next);
      loadPracticeSong(next.n);
      requestSongFile(next.n, true);
      paint();
    }

    function continuePracticeAtNext(song) {
      var next = practiceNextSong(song);
      if (!next) {
        finishPracticeAtStop(song);
        return;
      }
      practiceChain = true;
      stopPracticeAudio();
      practiceSel = next.g;
      practiceOffset = practiceSongStart(next);
      paint();
      startPractice(practiceOffset);
    }

    function followPracticeChain() {
      if (!practiceMode || !practicePlaying || practiceChain) return;
      var song = selectedSongRow();
      if (!song || practiceStops(song)) return;
      requestSongFile(song.n, false);
      var at = practiceNextAt(song);
      var next = practiceNextSong(song);
      if (next && (!(at > 0) || practiceAudioTime() > at - 8)) {
        loadPracticeSong(next.n);
        requestSongFile(next.n, false);
      }
      if (!(at > 0) || practiceAudioTime() + 0.02 < at) return;
      continuePracticeAtNext(song);
    }

    function startPractice(offset) {
      var song = selectedSongRow();
      if (!song) return;
      var ctx = ensurePracticeCtx();
      if (!ctx) return;
      var name = song.n;
      var guid = song.g;
      requestSongFile(name, false);
      var upcoming = practiceNextSong(song);
      if (upcoming) {
        loadPracticeSong(upcoming.n);
        requestSongFile(upcoming.n, false);
      }
      loadPracticeSong(name).then(function(buffer) {
        if (!practiceMode) return;
        var current = selectedSongRow();
        if (!current || current.g !== guid) {
          practiceChain = false;
          paint();
          return;
        }
        stopPracticeAudio();
        var dur = buffer.duration || 0;
        var at = Math.max(0, Number(offset) || 0);
        if (dur > 0 && at >= dur - 0.05) at = 0;
        var src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        practiceSong = name;
        practiceOffset = at;
        practiceStartAt = ctx.currentTime;
        practicePlaying = true;
        practiceChain = false;
        src.onended = function() {
          if (practiceSource !== src) return;
          practiceSource = null;
          practicePlaying = false;
          practiceOffset = dur || practiceOffset;
          if (practiceChain || !practiceMode || practiceSel !== guid) {
            paint();
            return;
          }
          var ended = null;
          for (var i = 0; i < rows.length; i++) {
            if (rows[i].k === "song" && rows[i].g === guid) ended = rows[i];
          }
          if (!ended) {
            paint();
            return;
          }
          if (practiceStops(ended)) finishPracticeAtStop(ended);
          else continuePracticeAtNext(ended);
        };
        practiceSource = src;
        try { src.start(0, at); } catch (err) {
          practicePlaying = false;
          practiceChain = false;
          practiceSource = null;
        }
        paint();
      }).catch(function() {
        practicePlaying = false;
        practiceChain = false;
        paint();
      });
    }

    function togglePractice() {
      if (!selectedSongRow()) return;
      ensurePracticeCtx();
      if (practicePlaying || practiceChain) {
        practiceChain = false;
        stopPracticeAudio();
        paint();
        return;
      }
      startPractice(practiceAudioTime());
    }

    function seekPractice(seconds) {
      var was = practicePlaying;
      practiceOffset = Math.max(0, Number(seconds) || 0);
      if (was) startPractice(practiceOffset);
      else {
        updateHead();
        refreshViews();
      }
    }

    function songGuidExists(guid) {
      if (!guid) return false;
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].k === "song" && rows[i].g === guid) return true;
      }
      return false;
    }

    function adoptPracticeSelection() {
      if (songGuidExists(practiceSel)) return;
      if (songGuidExists(rememberedSel)) {
        practiceSel = rememberedSel;
        return;
      }
      practiceSel = "";
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].k === "song") {
          practiceSel = rows[i].g;
          return;
        }
      }
    }

    function libraryNameOrder(a, b) {
      var an = a && a.n || "";
      var bn = b && b.n || "";
      var cmp = 0;
      try {
        cmp = an.localeCompare(bn, "tr", { sensitivity: "accent" });
      } catch (err) {
        cmp = an < bn ? -1 : (an > bn ? 1 : 0);
      }
      if (cmp) return cmp;
      return String(a && a.g || "").localeCompare(String(b && b.g || ""));
    }

    function withSortedLibrary(list) {
      var head = [];
      var marker = [];
      var library = [];
      var passed = false;
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        if (item.k === "final") passed = true;
        if (passed && item.k === "song" && !item.set) library.push(item);
        else if (passed) marker.push(item);
        else head.push(item);
      }
      library.sort(libraryNameOrder);
      return head.concat(marker).concat(library);
    }

    function applyPracticeRows(list) {
      if (liveNow() || rows.length) return false;
      var body = list && list.rows ? list.rows : list;
      if (!body || !body.length) return false;
      rows = withSortedLibrary(body);
      adoptPracticeSelection();
      render();
      return true;
    }

    function ensurePracticeList() {
      adoptPracticeSelection();
      if (rows.length || catalogTried) return;
      catalogTried = true;
      fetch("DBK_Stage/practice-setlist.json").then(function(res) {
        if (!res.ok) throw new Error("practice");
        return res.json();
      }).then(function(list) {
        if (!applyPracticeRows(list)) throw new Error("empty");
      }).catch(function() {
        return fetch("DBK_Stage/catalog.json").then(function(res) {
          if (!res.ok) throw new Error("catalog");
          return res.json();
        }).then(function(list) {
          applyPracticeRows(list);
        });
      }).catch(function() {});
    }

    function practiceSelect(guid) {
      if (!guid) return;
      var same = guid === practiceSel;
      var was = practicePlaying || practiceChain;
      practiceChain = false;
      stopPracticeAudio();
      practiceOffset = 0;
      practiceSel = guid;
      var song = selectedSongRow();
      if (song) loadPracticeSong(song.n);
      if (same && was) startPractice(0);
      paint();
    }

    function lyricCovers(lyrics, time) {
      for (var i = 0; i < lyrics.length; i++) {
        var line = lyrics[i];
        var start = Number(line.time) || 0;
        if (Math.abs(start - time) <= 0.05) return true;
        var end = Number(line.end);
        if (!(end > start)) continue;
        if (start < time + 0.05 && time + 0.05 < end) return true;
      }
      return false;
    }

    function buildLyricRows(data, hideCount) {
      var lyrics = (data && data.lyrics) || [];
      var sections = (data && data.sections) || [];
      var rows = [];
      var i;
      for (i = 0; i < sections.length; i++) {
        var section = sections[i];
        if (hideCount && cueNameIs(section.name, "COUNT")) continue;
        var start = Number(section.start) || 0;
        var end = Number(section.end);
        if (!(end > start)) end = start;
        if (lyricCovers(lyrics, start)) continue;
        var label = section.name || "";
        try { label = label.toLocaleUpperCase("tr-TR"); } catch (err) { label = label.toUpperCase(); }
        rows.push({ kind: "section", name: label, time: start, end: end });
      }
      for (i = 0; i < lyrics.length; i++) {
        var line = lyrics[i];
        var lineStart = Number(line.time) || 0;
        var lineEnd = Number(line.end);
        if (!(lineEnd > lineStart)) lineEnd = lineStart;
        var blocks = String(line.text || "").split(/\r?\n/);
        var text = [];
        for (var b = 0; b < blocks.length; b++) {
          var part = blocks[b].trim();
          if (part) text.push(part);
        }
        if (!text.length) continue;
        rows.push({ kind: "lyric", time: lineStart, end: lineEnd, text: text });
      }
      rows.sort(function(a, b) {
        if (a.time !== b.time) return a.time - b.time;
        return a.kind === "section" ? -1 : 1;
      });
      var duration = (data && Number(data.duration)) || 0;
      for (i = 0; i < rows.length; i++) {
        if (rows[i].end > rows[i].time) continue;
        rows[i].end = (rows[i + 1] && rows[i + 1].time) || duration || rows[i].time;
      }
      return rows;
    }

    function toneScale(data) {
      if (!data) return "";
      var tone = data.key ? String(data.key).trim() : "";
      var scale = data.scale ? String(data.scale).trim() : "";
      return [tone, scale].filter(Boolean).join(" ");
    }

    function timeSignature(data) {
      var meters = [];
      var map = (data && data.tempoMap) || [];
      for (var i = 0; i < map.length; i++) {
        if (!(map[i].numerator > 0) || !(map[i].denominator > 0)) continue;
        var sig = map[i].numerator + "/" + map[i].denominator;
        if (meters.indexOf(sig) < 0) meters.push(sig);
      }
      return meters.join(", ");
    }

    function kitaLabel(data) {
      if (!data) return "";
      var kita = data.kita != null ? data.kita : (data.info && data.info.kita);
      return kita > 0 ? "KITA " + kita : "";
    }

    function songMetaParts(data, page) {
      var parts = [];
      var tone = toneScale(data);
      if (tone) parts.push(tone);
      if (page === "score") {
        var kita = kitaLabel(data);
        var meter = timeSignature(data);
        if (kita) parts.push(kita);
        if (meter) parts.push(meter);
      }
      return parts;
    }

    function notePageKey(page) {
      return page === "chords" ? "chord" : page;
    }

    function noteLabel(page) {
      if (page === "chords") return "Chord notes";
      if (page === "score") return "Score notes";
      if (page === "drums") return "Drums notes";
      return "Lyrics notes";
    }

    function oneLine(text) {
      return String(text || "").replace(/\s*\n+\s*/g, " ");
    }

    function storedPageNote(name, data, page) {
      var key = notePageKey(page);
      var cached = name && settingsCache[name];
      var saved = cached && cached.settled && cached.data && cached.data.notes;
      if (saved && saved[key] != null) return oneLine(saved[key]);
      var notes = data && data.info && data.info.pageNotes;
      return notes && notes[key] != null ? oneLine(notes[key]) : "";
    }

    function songHead(name, data, page) {
      var head = document.createElement("div");
      head.className = "song-head";
      head.appendChild(songTitle(name, data, page));
      var field = document.createElement("input");
      field.type = "text";
      field.className = "song-note";
      field.setAttribute("aria-label", noteLabel(page));
      field.autocomplete = "off";
      field.spellcheck = false;
      var text = storedPageNote(name, data, page);
      field.value = text;
      field.classList.toggle("has-note", !!text.trim());
      field.readOnly = !notesEditable();
      field.hidden = !notesEditable() && !text.trim();
      field.addEventListener("input", function() {
        field.dataset.dirty = "1";
        var next = oneLine(field.value);
        if (next !== field.value) field.value = next;
        field.classList.toggle("has-note", !!field.value.trim());
      });
      field.addEventListener("blur", function() {
        savePageNote(name, page, field.value);
      });
      head.appendChild(field);
      if (name) requestSettings(name);
      return head;
    }

    function songTitle(name, data, page) {
      var bar = document.createElement("div");
      bar.className = "song-title";
      var title = document.createElement("span");
      title.className = "song-name";
      title.textContent = name || "";
      bar.appendChild(title);
      var parts = songMetaParts(data, page);
      if (!parts.length) return bar;
      var meta = document.createElement("span");
      meta.className = "song-meta";
      for (var i = 0; i < parts.length; i++) {
        if (i > 0) {
          var dot = document.createElement("span");
          dot.className = "song-meta-dot";
          dot.setAttribute("aria-hidden", "true");
          meta.appendChild(dot);
        }
        var bit = document.createElement("span");
        bit.textContent = parts[i];
        meta.appendChild(bit);
      }
      bar.appendChild(meta);
      return bar;
    }

    function cachedSong(name) {
      var cached = fileCache[name];
      return cached && cached.settled ? cached.data : undefined;
    }

    function appendLyricRows(parent, data, hideCount) {
      var list = buildLyricRows(data, hideCount);
      if (!list.length) {
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No lyrics";
        parent.appendChild(empty);
      } else {
      for (var i = 0; i < list.length; i++) {
        var row = list[i];
        var node = document.createElement("div");
        node.setAttribute("data-i", String(i));
        var head = document.createElement("span");
        head.className = "lyric-playhead";
        head.setAttribute("aria-hidden", "true");
        var cue = document.createElement("div");
        cue.className = "lyric-cue";
        if (row.kind === "section") {
          node.className = "lyric-section tone-" + sectionTone(row.name);
          cue.textContent = row.name;
        } else {
          node.className = "lyric-line future";
          node.setAttribute("data-t", String(row.time));
          node.setAttribute("data-e", String(row.end));
          for (var b = 0; b < row.text.length; b++) {
            var line = document.createElement("div");
            line.textContent = row.text[b];
            cue.appendChild(line);
          }
        }
        node.appendChild(head);
        node.appendChild(cue);
        parent.appendChild(node);
      }
      }
      appendCueBars(parent, cueKinds(data));
      return list;
    }

    function drawLyrics() {
      var host = document.getElementById("lyrics-stage");
      host.innerHTML = "";
      lyricRows = [];
      var pair = stagePair();
      if (!pair.length) return;
      for (var i = 0; i < pair.length; i++) {
        requestSongFile(pair[i].n, i === 0);
        var data = cachedSong(pair[i].n);
        var block = document.createElement("article");
        block.className = "song-block";
        block.setAttribute("data-name", pair[i].n);
        block.setAttribute("data-lyric", lyricSongSig(pair[i]));
        if (pair[i].g) block.setAttribute("data-g", pair[i].g);
        block.setAttribute("data-current", i === 0 ? "1" : "0");
        block.appendChild(songHead(pair[i].n, data, "lyrics"));
        if (data) {
          var built = appendLyricRows(block, data, countIsOff(pair[i]));
          if (i === 0) lyricRows = built;
        } else if (fileCache[pair[i].n] && fileCache[pair[i].n].settled) {
          var missing = document.createElement("p");
          missing.className = "empty";
          missing.textContent = "No lyrics";
          block.appendChild(missing);
        }
        host.appendChild(block);
      }
    }

    function markLyrics() {
      if (viewPage !== "lyrics") return;
      var pair = stagePair();
      var key = pair.map(function(song) {
        var cached = fileCache[song.n];
        var ready = cached && cached.data;
        return song.n + (countIsOff(song) ? ":off" : "") + "=" + (ready ? (cached.data.lyrics || []).length + ":" + (cached.data.sections || []).length : (cached && cached.settled ? "missing" : "wait"));
      }).join("|");
      if (key !== lyricKey) {
        lyricKey = key;
        lyricCurrent = -2;
        if (!reuseLyricPair(pair)) drawLyrics();
      }
      if (!lyricRows.length) return;
      var off = songOffset();
      var duration = Number(songFile && songFile.duration) || 0;
      var inside = off != null && off >= -0.05 && (duration <= 0 || off <= duration + 0.05);
      var time = inside ? Math.max(0, off) : -1;
      var nodes = document.querySelectorAll("#lyrics-stage [data-current='1'] [data-i]");
      for (var i = 0; i < lyricRows.length; i++) {
        var row = lyricRows[i];
        var state = "future";
        var fill = 0;
        if (time >= 0 && time >= row.end - 0.02) state = "past";
        else if (time >= 0 && time >= row.time - 0.02) {
          state = "current";
          fill = measureRangeFill(songFile.tempoMap, row.time, row.end, time);
        }
        var node = nodes[i];
        if (!node) continue;
        if (row.kind === "lyric") node.className = "lyric-line " + state;
        node.style.setProperty("--playhead", state === "past" ? "1" : String(fill));
      }
      paintStageCues("lyrics-stage", time);
      followLyricScroll();
    }

    function lyricSongSig(song) {
      var cached = fileCache[song.n];
      var ready = cached && cached.data;
      return song.n + (countIsOff(song) ? ":off" : "") + "=" + (ready ? ((cached.data.lyrics || []).length + ":" + (cached.data.sections || []).length) : (cached && cached.settled ? "missing" : "wait"));
    }

    function appendLyricSong(host, song, current) {
      requestSongFile(song.n, current);
      var data = cachedSong(song.n);
      var block = document.createElement("article");
      block.className = "song-block";
      block.setAttribute("data-name", song.n);
      block.setAttribute("data-lyric", lyricSongSig(song));
      if (song.g) block.setAttribute("data-g", song.g);
      block.setAttribute("data-current", current ? "1" : "0");
      block.appendChild(songHead(song.n, data, "lyrics"));
      if (data) appendLyricRows(block, data, countIsOff(song));
      else if (fileCache[song.n] && fileCache[song.n].settled) {
        var missing = document.createElement("p");
        missing.className = "empty";
        missing.textContent = "No lyrics";
        block.appendChild(missing);
      }
      host.appendChild(block);
    }

    function reuseLyricPair(pair) {
      if (!pair.length) return false;
      var host = document.getElementById("lyrics-stage");
      var view = document.getElementById("view");
      if (!host || !view) return false;
      var blocks = Array.prototype.slice.call(host.querySelectorAll(".song-block"));
      var keep = [];
      var i;
      for (i = 0; i < pair.length; i++) {
        var found = scoreBlockFor(blocks, pair[i]);
        if (found && found.getAttribute("data-lyric") !== lyricSongSig(pair[i])) {
          if (i === 0) return false;
          if (found.parentNode) found.parentNode.removeChild(found);
          found = null;
        }
        keep.push(found);
      }
      if (!keep[0] || !keep[0].querySelector(".lyric-line, .lyric-section, .empty")) return false;
      var before = keep[0].getBoundingClientRect().top;
      for (i = blocks.length - 1; i >= 0; i--) {
        if (keep.indexOf(blocks[i]) < 0 && blocks[i].parentNode) host.removeChild(blocks[i]);
      }
      for (i = 0; i < keep.length; i++) {
        if (!keep[i]) continue;
        keep[i].setAttribute("data-current", i === 0 ? "1" : "0");
        if (pair[i].g) keep[i].setAttribute("data-g", pair[i].g);
        host.appendChild(keep[i]);
      }
      var after = keep[0].getBoundingClientRect().top;
      if (Math.abs(after - before) > 0.5) view.scrollTop += after - before;
      scoreScrollGoal = null;
      for (i = 0; i < pair.length; i++) {
        if (!keep[i]) appendLyricSong(host, pair[i], i === 0);
      }
      var data = cachedSong(pair[0].n);
      lyricRows = data ? buildLyricRows(data, countIsOff(pair[0])) : [];
      return true;
    }

    function lyricNodeAt(article, time) {
      var lines = article.querySelectorAll(".lyric-line");
      var found = null;
      for (var i = 0; i < lines.length; i++) {
        var start = parseFloat(lines[i].getAttribute("data-t"));
        var end = parseFloat(lines[i].getAttribute("data-e"));
        if (time >= start - 0.02 && time < end - 0.02) found = lines[i];
      }
      return found;
    }

    function nextLyricNode(article, current) {
      var lines = article.querySelectorAll(".lyric-line");
      var i;
      for (i = 0; i < lines.length; i++) {
        if (lines[i] !== current) continue;
        if (lines[i + 1]) return lines[i + 1];
        break;
      }
      var host = article.parentElement;
      if (!host) return null;
      var blocks = host.querySelectorAll(".song-block");
      for (i = 0; i < blocks.length; i++) {
        if (blocks[i] === article && blocks[i + 1]) return blocks[i + 1].querySelector(".lyric-line");
      }
      return null;
    }

    function followLyricScroll() {
      if (viewPage !== "lyrics" || !stagePlaying()) return;
      var article = document.querySelector("#lyrics-stage [data-current='1']");
      if (!article) return;
      var time = songOffset();
      if (time == null || time < -0.05) return;
      var view = document.getElementById("view");
      if (!view) return;
      var current = lyricNodeAt(article, Math.max(0, time));
      if (!current) return;
      var next = nextLyricNode(article, current);
      var above = false;
      if (next) {
        var nextTop = next.getBoundingClientRect().top;
        var hereTop = current.getBoundingClientRect().top;
        above = nextTop < hereTop - 10;
      }
      if (above && next) {
        revealScoreWrap(view, current, next);
        return;
      }
      var nodes = [current];
      if (next && next !== current) nodes.push(next);
