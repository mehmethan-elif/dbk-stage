      node.setAttribute("data-cycle", String(run.cycle || 0));
      node.setAttribute("data-repeats", String(run.repeats || 1));
      node.style.setProperty("--drum-steps", String(run.steps || 16));
      node.style.setProperty("--drum-bar-steps", String(run.barSteps || 16));
      var name = document.createElement("div");
      name.className = "drum-measure-name";
      var pattern = document.createElement("span");
      pattern.className = "drum-pattern-name";
      pattern.textContent = run.name;
      var repeat = document.createElement("span");
      repeat.className = "drum-repeat";
      repeat.innerHTML = "x" + run.repeats + '<span class="drum-count">1</span>';
      name.appendChild(pattern);
      name.appendChild(repeat);
      var staff = document.createElement("div");
      staff.className = "drum-grid";
      var lanes = ["F", "E", "D", "C"];
      for (var lane = 0; lane < lanes.length; lane++) {
        var row = document.createElement("div");
        row.className = "drum-lane";
        var steps = (run.hits && run.hits[lanes[lane]]) || [];
        for (var h = 0; h < steps.length; h++) {
          var hit = document.createElement("span");
          hit.className = "drum-hit";
          hit.setAttribute("data-note", lanes[lane]);
          hit.style.setProperty("--drum-hit", String(steps[h]));
          row.appendChild(hit);
        }
        staff.appendChild(row);
      }
      node.appendChild(name);
      node.appendChild(staff);
      return node;
    }

    function appendDrumChart(parent, data, sheet, hideCount) {
      var source = sheet.rows || [];
      if (hideCount) {
        source = source.filter(function(row) {
          return !cueNameIs(row.section && row.section.name, "COUNT");
        });
      }
      if (!source.length) {
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No Pattern Data";
        parent.appendChild(empty);
        return;
      }
      var list = document.createElement("div");
      list.className = "drum-list";
      var packs = packDrumRows(source);
      for (var p = 0; p < packs.length; p++) {
        var written = packs[p];
        var pair = written.length === 2;
        var span = false;
        var showGrids = false;
        for (var i = 0; i < written.length; i++) {
          var tone = sectionTone(written[i].section.name);
          if (tone !== "count") showGrids = true;
          if (tone === "count" || written[i].runs.length >= 2) span = true;
        }
        var pack = document.createElement("div");
        pack.className = "drum-pack" + (pair ? " pair" : "");
        var titles = document.createElement("div");
        titles.className = "drum-pack-titles" + (span ? " span" : "");
        for (var t = 0; t < written.length; t++) titles.appendChild(drumSectionTitle(written[t]));
        pack.appendChild(titles);
        if (showGrids) {
          var grids = document.createElement("div");
          grids.className = "drum-pack-grids";
          for (var g = 0; g < written.length; g++) {
            if (sectionTone(written[g].section.name) === "count") {
              grids.appendChild(document.createElement("div"));
              continue;
            }
            var runs = document.createElement("div");
            runs.className = "drum-section-runs";
            runs.setAttribute("data-drum-section", written[g].block.id);
            runs.setAttribute("data-drum-copy", String(written[g].copy));
            for (var n = 0; n < written[g].runs.length; n++) {
              runs.appendChild(drumRunView(written[g].runs[n], written[g].block.id, written[g].copy));
            }
            grids.appendChild(runs);
          }
          pack.appendChild(grids);
        }
        list.appendChild(pack);
      }
      appendCueBars(list, sheet.cues || cueKinds(data));
      parent.appendChild(list);
    }

    function drawChart(page) {
      var token = ++chartToken;
      var host = document.getElementById(page + "-stage");
      host.innerHTML = "";
      var pair = stagePair();
      ensureCharts().then(function() {
        if (token !== chartToken || viewPage !== page) return;
        host.innerHTML = "";
        for (var i = 0; i < pair.length; i++) {
          requestSongFile(pair[i].n, i === 0);
          var data = cachedSong(pair[i].n);
          var block = document.createElement("article");
          block.className = "song-block";
          block.setAttribute("data-name", pair[i].n);
          block.setAttribute("data-chart", chartSongSig(page, pair[i]));
          if (pair[i].g) block.setAttribute("data-g", pair[i].g);
          block.setAttribute("data-current", i === 0 ? "1" : "0");
          block.appendChild(songHead(pair[i].n, data, page));
          if (data) {
            var sheet = page === "chords" ? stageCharts.chordSheet(data) : stageCharts.drumSheet(data);
            block._sheet = sheet;
            block._song = data;
            if (page === "chords") appendChordChart(block, data, sheet, countIsOff(pair[i]));
            else appendDrumChart(block, data, sheet, countIsOff(pair[i]));
          } else if (fileCache[pair[i].n] && fileCache[pair[i].n].settled) {
            var missing = document.createElement("p");
            missing.className = "empty";
            missing.textContent = page === "chords" ? "No Chords" : "No Pattern Data";
            block.appendChild(missing);
          }
          host.appendChild(block);
        }
        paintChart(page);
        scrollPinnedSong();
      }).catch(function() {
        if (token !== chartToken) return;
        host.innerHTML = "";
        var note = document.createElement("p");
        note.className = "empty";
        note.textContent = page === "chords" ? "No Chords" : "No Pattern Data";
        host.appendChild(note);
      });
    }

    function paintChart(page) {
      if (viewPage !== page) return;
      var article = document.querySelector("#" + page + "-stage [data-current='1']");
      if (!article || !article._sheet || !stageCharts) return;
      var off = songOffset();
      var duration = Number(songFile && songFile.duration) || 0;
      var inside = off != null && off >= -0.05 && (duration <= 0 || off <= duration + 0.05);
      var time = inside ? Math.max(0, off) : -1;
      var song = article._song;
      var map = (song && song.tempoMap) || [];
      if (page === "chords") paintChordMarks(article, time, map);
      else paintDrumMarks(article, time, map);
      paintStageCues(page + "-stage", time);
      followChartScroll(page);
    }

    function paintChordMarks(article, time, map) {
      var head = time >= 0 ? stageCharts.chordAt(article._sheet.chart, article._sheet.form, time, map) : null;
      var names = article.querySelectorAll("[data-chord-section]");
      var nextSection = head && head.next && head.nextPlaying && head.nextPlaying !== head.playing ? head.nextPlaying : "";
      var i;
      for (i = 0; i < names.length; i++) {
        var id = names[i].getAttribute("data-chord-section");
        var on = !!(head && head.playing === id);
        names[i].classList.toggle("current", on);
        names[i].classList.toggle("next", !on && !!nextSection && id === nextSection);
        var fill = on && head ? measureRangeFill(map, head.fillStart, head.fillEnd, time) : 0;
        names[i].style.setProperty("--playhead", String(fill));
      }
      var bars = article.querySelectorAll("[data-chord-bar]");
      var currentKey = head ? head.blockId + "#" + head.measure : "";
      var nextKey = head && head.next ? head.next.blockId + "#" + head.next.measure : "";
      var currentBar = null;
      for (i = 0; i < bars.length; i++) {
        var key = bars[i].getAttribute("data-chord-bar");
        var isCurrent = key === currentKey;
        var isNext = !isCurrent && key === nextKey;
        bars[i].classList.toggle("current", isCurrent);
        bars[i].classList.toggle("next", isNext);
        var slots = bars[i].querySelectorAll(".chord-slot");
        if (slots.length > 1) {
          for (var s = 0; s < slots.length; s++) {
            var from = parseFloat(slots[s].getAttribute("data-slot-from"));
            var to = parseFloat(slots[s].getAttribute("data-slot-to"));
            slots[s].classList.toggle("current", isCurrent && head && head.phase >= from && head.phase < to);
          }
        }
        if (isCurrent) currentBar = bars[i];
      }
      if (currentBar && !nextKey) {
        var follow = null;
        for (i = 0; i < bars.length; i++) {
          if (bars[i] === currentBar) {
            follow = bars[i + 1] || null;
            break;
          }
        }
        if (follow) {
          var hereRow = currentBar.closest(".chord-row");
          var nextRow = follow.closest(".chord-row");
          if (hereRow && nextRow && hereRow !== nextRow && (hereRow.compareDocumentPosition(nextRow) & 4)) {
            follow.classList.add("next");
            nextKey = follow.getAttribute("data-chord-bar") || "";
          }
        }
      }
    }

    function paintDrumMarks(article, time, map) {
      var pos = time >= 0 ? stageCharts.drumAt(article._sheet.form, time, map) : null;
      var names = article.querySelectorAll(".drum-section-name[data-drum-section]");
      var currentName = null;
      var currentNameAt = -1;
      var i;
      for (i = 0; i < names.length; i++) {
        var on = !!(pos && names[i].getAttribute("data-drum-section") === pos.blockId && names[i].getAttribute("data-drum-copy") === String(pos.copy));
        names[i].classList.toggle("current", on);
        names[i].style.setProperty("--playhead", on && pos ? String(measureRangeFill(map, pos.fillStart, pos.fillEnd, time)) : "0");
        if (on) {
          currentName = names[i];
          currentNameAt = i;
        }
      }
      var nextSection = !!(pos && (pos.nextBlockId !== pos.blockId || String(pos.nextCopy) !== String(pos.copy)));
      for (i = 0; i < names.length; i++) {
        var sectionNext = !!(nextSection && names[i].getAttribute("data-drum-section") === pos.nextBlockId && names[i].getAttribute("data-drum-copy") === String(pos.nextCopy));
        names[i].classList.toggle("next", sectionNext && !names[i].classList.contains("current"));
      }
      var runs = article.querySelectorAll(".drum-run");
      var currentRun = null;
      for (i = 0; i < runs.length; i++) {
        var same = pos && runs[i].getAttribute("data-block-id") === pos.blockId && runs[i].getAttribute("data-drum-copy") === String(pos.copy);
        var start = parseFloat(runs[i].getAttribute("data-t"));
        var end = parseFloat(runs[i].getAttribute("data-e"));
        var onRun = !!(same && pos.originTime >= start - 0.02 && pos.originTime < end - 0.02);
        runs[i].classList.toggle("current", onRun);
        var repeats = parseInt(runs[i].getAttribute("data-repeats"), 10) || 1;
        var cycle = parseFloat(runs[i].getAttribute("data-cycle"));
        if (!(cycle > 0)) cycle = Math.max(0.02, (end - start) / repeats);
        var count = runs[i].querySelector(".drum-count");
        if (count) {
          var n = 1;
          if (onRun) n = Math.min(repeats, Math.floor(Math.max(0, pos.originTime - start) / cycle) + 1);
          count.textContent = String(n);
        }
        if (onRun) currentRun = runs[i];
      }
      for (i = 0; i < runs.length; i++) {
        var nextStart = parseFloat(runs[i].getAttribute("data-t"));
        var nextEnd = parseFloat(runs[i].getAttribute("data-e"));
        var holdsNext = !!(pos && pos.nextOrigin >= 0 && pos.nextOrigin >= nextStart - 0.02 && pos.nextOrigin < nextEnd - 0.02 && runs[i].getAttribute("data-block-id") === pos.nextBlockId && runs[i].getAttribute("data-drum-copy") === String(pos.nextCopy));
        var patternNext = holdsNext && runs[i] !== currentRun;
        runs[i].classList.toggle("next", patternNext);
      }
    }

    function chartSongSig(page, song) {
      var cached = fileCache[song.n];
      var ready = cached && cached.data;
      var count = 0;
      if (ready) count = ((page === "chords" ? cached.data.chords : cached.data.patterns) || []).length;
      return song.n + (countIsOff(song) ? ":off" : "") + "=" + (ready ? count : (cached && cached.settled ? "missing" : "wait"));
    }

    function markChart(page) {
      if (viewPage !== page) return;
      var pair = stagePair();
      var key = pair.map(function(song) { return chartSongSig(page, song); }).join("|");
      var stored = page === "chords" ? chordKey : drumKey;
      if (key !== stored) {
        if (page === "chords") { chordKey = key; chordMark = ""; }
        else { drumKey = key; drumMark = ""; }
        if (!reuseChartPair(page, pair)) drawChart(page);
        else paintChart(page);
        return;
      }
      paintChart(page);
    }

    function appendChartSong(host, page, song, current) {
      requestSongFile(song.n, current);
      var data = cachedSong(song.n);
      var block = document.createElement("article");
      block.className = "song-block";
      block.setAttribute("data-name", song.n);
      block.setAttribute("data-chart", chartSongSig(page, song));
      if (song.g) block.setAttribute("data-g", song.g);
      block.setAttribute("data-current", current ? "1" : "0");
      block.appendChild(songHead(song.n, data, page));
      if (data && stageCharts) {
        var sheet = page === "chords" ? stageCharts.chordSheet(data) : stageCharts.drumSheet(data);
        block._sheet = sheet;
        block._song = data;
        if (page === "chords") appendChordChart(block, data, sheet, countIsOff(song));
        else appendDrumChart(block, data, sheet, countIsOff(song));
      }
      host.appendChild(block);
      return block;
    }

    function reuseChartPair(page, pair) {
      if (!pair.length) return false;
      var host = document.getElementById(page + "-stage");
      var view = document.getElementById("view");
      if (!host || !view) return false;
      var blocks = Array.prototype.slice.call(host.querySelectorAll(".song-block"));
      var keep = [];
      var i;
      for (i = 0; i < pair.length; i++) {
        var found = scoreBlockFor(blocks, pair[i]);
        var sig = chartSongSig(page, pair[i]);
        if (found && found.getAttribute("data-chart") !== sig) {
          if (i === 0) return false;
          if (found.parentNode) found.parentNode.removeChild(found);
          found = null;
        }
        keep.push(found);
      }
      if (!keep[0] || !keep[0]._sheet) return false;
      var before = keep[0].getBoundingClientRect().top;
      for (i = blocks.length - 1; i >= 0; i--) {
        if (keep.indexOf(blocks[i]) < 0 && blocks[i].parentNode) host.removeChild(blocks[i]);
      }
      for (i = 0; i < keep.length; i++) {
        if (!keep[i]) continue;
        keep[i].setAttribute("data-current", i === 0 ? "1" : "0");
        if (pair[i].g) keep[i].setAttribute("data-g", pair[i].g);
        host.appendChild(keep[i]);
      }
      var after = keep[0].getBoundingClientRect().top;
      if (Math.abs(after - before) > 0.5) view.scrollTop += after - before;
      scoreScrollGoal = null;
      for (i = 0; i < pair.length; i++) {
        if (!keep[i]) appendChartSong(host, page, pair[i], i === 0);
      }
      return true;
    }

    function chartMomentAfter(map, duration, time) {
      var musical = timeToMusical(map, time);
      var at = musical.end + 0.001;
      if (!(at > time + 1e-6)) return null;
      if (duration > 0 && at > duration + 0.05) return null;
      return at;
    }

    function chordBarNode(root, blockId, measure) {
      if (!root || !blockId) return null;
      var key = blockId + "#" + measure;
      var nodes = root.querySelectorAll("[data-chord-bar]");
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].getAttribute("data-chord-bar") === key) return nodes[i];
      }
      return null;
    }

    function drumRunNode(root, pos) {
      if (!root || !pos) return null;
      var runs = root.querySelectorAll(".drum-run");
      var i;
      for (i = 0; i < runs.length; i++) {
        if (runs[i].getAttribute("data-block-id") !== pos.blockId) continue;
        if (runs[i].getAttribute("data-drum-copy") !== String(pos.copy)) continue;
        var start = parseFloat(runs[i].getAttribute("data-t"));
        var end = parseFloat(runs[i].getAttribute("data-e"));
        if (pos.originTime >= start - 0.02 && pos.originTime < end - 0.02) return runs[i];
      }
      for (i = 0; i < runs.length; i++) {
        if (runs[i].getAttribute("data-block-id") === pos.blockId && runs[i].getAttribute("data-drum-copy") === String(pos.copy)) return runs[i];
      }
      return null;
    }

    function chartNodeAt(page, article, time) {
      if (!article || !article._sheet || !article._song || !stageCharts) return null;
      var map = article._song.tempoMap || [];
      if (page === "chords") {
        var head = stageCharts.chordAt(article._sheet.chart, article._sheet.form, time, map);
        if (!head) return null;
        return chordBarNode(article, head.blockId, head.measure);
      }
      var pos = stageCharts.drumAt(article._sheet.form, time, map);
      if (!pos) return null;
      return drumRunNode(article, pos);
    }

    function chartLineEl(page, node) {
      if (!node) return null;
      if (page === "chords") return node.closest(".chord-row") || node;
      return node;
    }

    function shareChartLine(page, a, b) {
      if (!a || !b) return false;
      if (page === "chords") return chartLineEl(page, a) === chartLineEl(page, b);
      var ra = a.getBoundingClientRect();
      var rb = b.getBoundingClientRect();
      if (Math.abs(ra.top - rb.top) < 10) return true;
      var overlap = Math.min(ra.bottom, rb.bottom) - Math.max(ra.top, rb.top);
      var smaller = Math.min(ra.height, rb.height);
      return smaller > 0 && overlap > smaller * 0.4;
    }

    function chartLineAbove(page, node, current) {
      var line = chartLineEl(page, node);
      var here = chartLineEl(page, current);
      if (!line || !here || shareChartLine(page, node, current)) return false;
      return line.getBoundingClientRect().top < here.getBoundingClientRect().top - 10;
    }

    function firstChartHit(page, article, map, duration, time) {
      var cursor = time;
      for (var guard = 0; guard < 400; guard++) {
        var at = chartMomentAfter(map, duration, cursor);
        if (at == null) return null;
        if (chartNodeAt(page, article, at)) return at;
        cursor = at;
      }
      return null;
    }

    function nextDifferentChartLine(page, article, map, duration, time, current) {
      var cursor = time;
      for (var guard = 0; guard < 400; guard++) {
        var at = chartMomentAfter(map, duration, cursor);
        if (at == null) return null;
        var node = chartNodeAt(page, article, at);
        if (node && !shareChartLine(page, node, current)) return node;
        cursor = at;
      }
      return null;
    }

    function nextSongChartLine(page, article) {
      var host = article && article.parentElement;
      if (!host) return null;
      var blocks = host.querySelectorAll(".song-block");
      var next = null;
      var i;
      for (i = 0; i < blocks.length; i++) {
        if (blocks[i] === article) {
          next = blocks[i + 1] || null;
          break;
        }
      }
      if (!next) return null;
      if (page === "chords") return next.querySelector(".chord-row");
      return next.querySelector(".drum-run");
    }

    function nextChartLine(page, article, time) {
      var song = article._song;
      var map = (song && song.tempoMap) || [];
      var duration = Number(song && song.duration) || 0;
      var current = chartNodeAt(page, article, time);
      if (!current) return null;
      var at = firstChartHit(page, article, map, duration, time);
      if (at != null) {
        var node = chartNodeAt(page, article, at);
        if (node && !shareChartLine(page, node, current)) {
          return { current: current, line: chartLineEl(page, node), above: chartLineAbove(page, node, current) };
        }
        var later = nextDifferentChartLine(page, article, map, duration, node ? at : time, current);
        if (later && chartLineAbove(page, later, current)) {
          return { current: current, line: chartLineEl(page, later), above: true };
        }
        if (later) return { current: current, line: null, above: false };
      }
      return { current: current, line: nextSongChartLine(page, article), above: false };
    }

    function followChartScroll(page) {
      if (viewPage !== page || !stagePlaying()) return;
      if (page !== "chords" && page !== "drums") return;
      var article = document.querySelector("#" + page + "-stage [data-current='1']");
      if (!article || !article._sheet) return;
      var time = songOffset();
      if (time == null || time < -0.05) return;
      var view = document.getElementById("view");
      if (!view) return;
      var upcoming = nextChartLine(page, article, Math.max(0, time));
      if (!upcoming || !upcoming.current) return;
      if (upcoming.above && upcoming.line) {
        revealScoreWrap(view, upcoming.current, upcoming.line);
        return;
      }
      var nodes = [upcoming.current];
      if (upcoming.line && upcoming.line !== upcoming.current) nodes.push(upcoming.line);
      revealScoreLines(view, nodes);
    }

    function scoreMessage(text) {
      var host = document.getElementById("score-stage");
      host.innerHTML = "";
      var note = document.createElement("p");
      note.className = "empty";
      note.textContent = text;
      host.appendChild(note);
    }

    function refreshScoreTitles(pair) {
      var blocks = document.querySelectorAll("#score-stage .song-block");
      if (blocks.length !== pair.length) return;
      for (var i = 0; i < pair.length; i++) {
        var head = blocks[i].querySelector(".song-head");
        var data = cachedSong(pair[i].n);
        if (!head) {
          blocks[i].insertBefore(songHead(pair[i].n, data, "score"), blocks[i].firstChild);
        } else {
          var title = head.querySelector(".song-title");
          var fresh = songTitle(pair[i].n, data, "score");
          if (title) head.replaceChild(fresh, title);
          else head.insertBefore(fresh, head.firstChild);
        }
        ensureScoreCountBar(blocks[i], data);
        ensureScoreCues(blocks[i], data);
      }
    }

    function dropScoreDocs(keep) {
      var names = Object.keys(scoreDocs);
      for (var i = 0; i < names.length; i++) {
        if (keep.indexOf(names[i]) >= 0) continue;
        if (scoreDocs[names[i]] && scoreDocs[names[i]].destroy) scoreDocs[names[i]].destroy();
        delete scoreDocs[names[i]];
        delete scoreLoads[names[i]];
        delete scoreStamps[names[i]];
      }
    }

    function ensurePdfJs() {
      if (pdfjsPromise) return pdfjsPromise;
      function blobUrl(path) {
        return fetch(path).then(function(response) {
          if (!response.ok) throw new Error("pdfjs");
          return response.text();
        }).then(function(text) {
          return URL.createObjectURL(new Blob([text], { type: "text/javascript" }));
        });
      }
      pdfjsPromise = Promise.all([
        blobUrl("DBK_Stage/pdf.min.mjs"),
        blobUrl("DBK_Stage/pdf.worker.min.mjs")
      ]).then(function(urls) {
        return import(urls[0]).then(function(lib) {
          lib.GlobalWorkerOptions.workerSrc = urls[1];
          return lib;
        });
      });
      pdfjsPromise.catch(function() { pdfjsPromise = null; });
      return pdfjsPromise;
    }

    function paintDoc(doc, host, job, attempt) {
      if (!doc || job !== scoreJob) return Promise.resolve();
      var width = host.clientWidth;
      if (width < 8) width = document.getElementById("view").clientWidth - 28;
      if (width < 8) {
        if ((attempt || 0) > 12) return Promise.resolve();
        return new Promise(function(resolve) {
          requestAnimationFrame(function() { resolve(paintDoc(doc, host, job, (attempt || 0) + 1)); });
        });
      }
      scoreWidth = document.getElementById("view").clientWidth;
      host.innerHTML = "";
      var dpr = window.devicePixelRatio || 1;
      var chain = Promise.resolve();
      for (var number = 1; number <= doc.numPages; number++) {
        chain = chain.then(paintOne(number));
      }
      return chain;

      function paintOne(pageNumber) {
        return function() {
          if (job !== scoreJob) return null;
          return doc.getPage(pageNumber).then(function(page) {
            if (job !== scoreJob) return null;
            var base = page.getViewport({ scale: 1 });
            var viewport = page.getViewport({ scale: (width / base.width) * dpr });
            var canvas = document.createElement("canvas");
            canvas.className = "score-page";
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            var wrap = document.createElement("div");

    function scoreBytesStamp(buffer) {

      if (n) hash = (Math.imul(hash, 33) + bytes[n - 1]) >>> 0;
      return n + ":" + hash;

    function fetchScoreBytes(name) {

    function sectionSpan(section, map) {

    function relativeMeasure(section, map, time) {

    function countChordLabel(data, section) {

    function ensureScoreCountBar(block, data) {

    function paintScoreCountBar(block, data, time) {
      ensureScoreCountBar(block, data);
      var stack = block.querySelector(".nota-count-stack");
      var bar = block.querySelector(".nota-count-bar");
      var first = data && data.sections && data.sections[0];
      if (!stack || !bar || !first) return;
      var section = time >= 0 ? sectionAtTime(data, time) : null;
      var showingCount = !section || Math.abs(Number(section.start) - Number(first.start)) < 0.02;
      var row = songRowByGuid(block.getAttribute("data-g") || "");
      if (showingCount && countTrim(row) > 0) {
        stack.hidden = true;
        return;
      }
      stack.hidden = false;

      var label = countChordLabel(data, first);

        name = section.name || "";
        label = "";
        var span = sectionSpan(section, data.tempoMap);
        var measure = relativeMeasure(section, data.tempoMap, Math.min(Math.max(time, section.start), Math.max(section.start, section.end - 0.02)));
        fill = span && span.total ? Math.min(1, Math.max(0, measure / span.total)) : 0;
      } else if (time >= 0) {
        fill = Math.min(1, Math.max(0, (time - Number(first.start)) / Math.max(0.02, Number(first.end) - Number(first.start))));

    function nextScoreHit(data, time) {
      if (!data) return null;
      var cursor = time;
      var duration = Number(data.duration) || 0;
      var guard;
      for (guard = 0; guard < 400; guard++) {
        var musical = timeToMusical(data.tempoMap, cursor);
        var at = musical.end + 0.001;
        if (!(at > cursor + 1e-6)) return null;
        if (duration > 0 && at > duration + 0.05) return null;
        var hit = hitAt(data, at);
        if (hit) return hit;
        cursor = at;
      }
      return null;
    }

    function lookAheadHit(data, time, broken, rects) {
      var following = nextScoreHit(data, time);
      if (!following) return null;
      if (following.measure === 1) return following;
      if (!isChained(broken || [], following.name, following.measure)) return following;
      if (scoreLineChanges(rects, hitAt(data, time), following)) return following;
      return null;
    }

    function scoreMeasureBox(rects, hit) {
      if (!hit || !rects) return null;
      for (var i = 0; i < rects.length; i++) {
        var box = rects[i];
        if (isLabel(box)) continue;
        if (box.name === hit.name && Number(box.measure) === hit.measure) return box;
      }
      return null;
    }

    function scoreLineChanges(rects, current, following) {
      var now = scoreMeasureBox(rects, current);
      var next = scoreMeasureBox(rects, following);
      if (!now || !next) return false;
      return !shareStaffLine(next, now);
    }

    function markScore() {
      if (viewPage !== "score") return;
      var countKey = stagePair().map(function(song) {
        return (song.g || song.n) + (countIsOff(song) ? ":off" : ":on");
      }).join("|");
      if (countKey !== scoreCountKey) {
        scoreCountKey = countKey;
        var laid = {};
        var laidBlocks = document.querySelectorAll("#score-stage .song-block");
        for (var s = 0; s < laidBlocks.length; s++) {
          var scoreName = laidBlocks[s].getAttribute("data-name") || "";
          if (!scoreName || laid[scoreName]) continue;
          laid[scoreName] = true;
          layoutScore(scoreName);
        }
        if (Object.keys(laid).length) return;
      }
      var song = selectedSongRow();
      var data = song && cachedSong(song.n);
      var off = songOffset();
      var inside = !!(data && off != null && off >= -0.05 && (!(Number(data.duration) > 0) || off <= Number(data.duration) + 0.05));
      var time = inside ? Math.max(0, off) : -1;

      var nextBox = null;

      }

      for (var b = 0; b < blocks.length; b++) {

        var blockData = cachedSong(blocks[b].getAttribute("data-name") || "");
        paintScoreCountBar(blocks[b], blockData, active ? time : -1);
        var nodes = blocks[b].querySelectorAll(".score-rect.bar");

          nodes[i].classList.toggle("next", upcoming);

    function stagePlaying() {

    }

    function scoreBlockNamed(name) {
      var blocks = document.querySelectorAll("#score-stage .song-block");
      for (var i = 0; i < blocks.length; i++) {
        if (blocks[i].getAttribute("data-name") === name) return blocks[i];

    }

    function scoreBarNode(songName, box) {
      var block = scoreBlockNamed(songName);
      if (!block || !box || !box.id) return null;
      var nodes = block.querySelectorAll(".score-rect.bar");
      for (var i = 0; i < nodes.length; i++) {
        if (nodes[i].getAttribute("data-id") === box.id) return nodes[i];

    function scoreBoxAt(songName, data, time) {
      if (!data) return null;
      var sections = data.sections || [];
      var index = -1;
      var i;
      for (i = 0; i < sections.length; i++) {
        var start = Number(sections[i].start) || 0;
        var end = Number(sections[i].end);
        if (time >= start - 0.001 && time < end) index = i;
      }
      if (index < 0) return null;
      var hit = hitAt(data, time);
      if (!hit) return null;
      var rects = rectsFor(songName) || [];
      var matches = [];
      for (i = 0; i < rects.length; i++) {
        var box = rects[i];
        if (!isLabel(box) && box.name === hit.name && Number(box.measure) === hit.measure) matches.push(box);
      }
      if (!matches.length) return null;
      var chained = isChained(songBroken(songName), hit.name, hit.measure);
      if (chained) {
        for (i = 0; i < matches.length; i++) if (matches[i].sectionIndex == null) return matches[i];
        return matches[0];
      }
      for (i = 0; i < matches.length; i++) if (matches[i].sectionIndex === index) return matches[i];
      var wanted = voltaIndex(sections, hit.name, index);
      for (i = 0; i < matches.length; i++) if (matches[i].sectionIndex === wanted) return matches[i];
      for (i = 0; i < matches.length; i++) if (matches[i].sectionIndex == null) return matches[i];
      return matches[0];
    }

    function nextScoreMoment(data, time) {
      var cursor = time;
      var duration = Number(data.duration) || 0;

      for (guard = 0; guard < 400; guard++) {
        var musical = timeToMusical(data.tempoMap, cursor);
        var at = musical.end + 0.001;
        if (!(at > cursor + 1e-6)) return null;
        if (duration > 0 && at > duration + 0.05) return null;

        cursor = at;
      }
      return null;
    }

    function nextSongScoreLine(song) {
      var pair = stagePair();
      var nextSong = pair.length > 1 ? pair[1] : null;
      if (!nextSong || nextSong === song) return null;
      var nextData = cachedSong(nextSong.n);
      var sections = (nextData && nextData.sections) || [];
      for (var s = 0; s < sections.length; s++) {
        if (sectionTone(sections[s].name) === "count") continue;
        var line = scoreBoxAt(nextSong.n, nextData, (Number(sections[s].start) || 0) + 0.02);
        if (line) return { song: nextSong, box: line, other: true };
      }
      return null;
    }

    function lineAbove(box, current) {
      if (!box || !current) return false;

      return box.y < current.y - 0.02 && !shareStaffLine(box, current);
    }

    function nextDifferentStaff(song, data, time, current) {
      var cursor = time;
      var duration = Number(data.duration) || 0;
      var guard;
      for (guard = 0; guard < 400; guard++) {
        var musical = timeToMusical(data.tempoMap, cursor);
        var at = musical.end + 0.001;
        if (!(at > cursor + 1e-6)) return null;
        if (duration > 0 && at > duration + 0.05) return null;
        var box = scoreBoxAt(song.n, data, at);
        if (box && (!current || !shareStaffLine(box, current))) return { box: box, at: at };
        cursor = at;
      }
      return null;
    }

    function nextScoreLine(song, data, time) {
      var current = scoreBoxAt(song.n, data, time);
      var at = nextScoreMoment(data, time);
      if (at != null) {

          return { song: song, box: box, other: false };

        var later = nextDifferentStaff(song, data, box ? at : time, current);
        if (later && lineAbove(later.box, current)) return { song: song, box: later.box, at: later.at, above: true };
        if (later) return null;

      return nextSongScoreLine(song);

    var scoreScrollGoal = null;
    var scoreScrollFrom = 0;
    var scoreScrollStart = 0;
    var scoreScrollFrame = 0;
    var scoreScrollPage = "score";

    function easeScoreScroll() {
      if (scoreScrollFrame) return;
      function step(now) {
        scoreScrollFrame = 0;
        if (scoreScrollGoal == null || viewPage !== scoreScrollPage || (scoreScrollPage === "score" && scoreEdit) || !stagePlaying()) {
          scoreScrollGoal = null;
          return;
        }
        var view = document.getElementById("view");
        if (!view) return;
        var t = (now - scoreScrollStart) / 1000;
        if (t >= 1) {
          view.scrollTop = scoreScrollGoal;
          scoreScrollGoal = null;
          return;
        }

      return ids.join("|");
    }

    function prepStopAfter(songBlock) {
      var next = songBlock.nextElementSibling;
      if (next && next.getAttribute("data-k") === "stop" && next.getAttribute("data-g") === songBlock.getAttribute("data-g")) return next;
      return null;
    }

    function prepSongUnit(block) {
      if (!block) return null;
      if (block.getAttribute("data-k") === "stop") {
        var prev = block.previousElementSibling;
        if (prev && prev.getAttribute("data-k") === "song" && prev.getAttribute("data-set") === "1" && prev.getAttribute("data-g") === block.getAttribute("data-g")) return prev;
        return null;
      }
      if (block.getAttribute("data-k") === "song" && block.getAttribute("data-set") === "1") return block;
      return null;
    }

    function prepDropIndex(clientY) {
      var songs = document.querySelectorAll('#prep-list .prep-block[data-set="1"]');
      for (var i = 0; i < songs.length; i++) {
        var rect = songs[i].getBoundingClientRect();
        if (clientY < rect.top + rect.height / 2) return i;
      }
      return songs.length;
    }

    function reorderPrepDom(songBlock, clientY) {
      var list = document.getElementById("prep-list");
      var songs = Array.prototype.slice.call(list.querySelectorAll('.prep-block[data-set="1"]'));
      var from = songs.indexOf(songBlock);
      if (from < 0) return;
      var toIndex = prepDropIndex(clientY);
      var dest = toIndex > from ? toIndex - 1 : toIndex;
      if (dest === from) return;
      var without = songs.slice();
      without.splice(from, 1);
      var target = without[dest];
      var anchor = list.querySelector(".prep-final") || list.querySelector(".prep-lib-title");
      var following = prepStopAfter(songBlock);
      var takeStop = following && following.getAttribute("data-auto") === "1" ? following : null;
      if (target) list.insertBefore(songBlock, target);
      else if (anchor) list.insertBefore(songBlock, anchor);
      if (takeStop) list.insertBefore(takeStop, songBlock.nextSibling);
      var ordered = list.querySelectorAll('.prep-block[data-set="1"]');
      for (var i = 0; i < ordered.length; i++) {
        var num = ordered[i].querySelector(".prep-cell.num");
        var n = i + 1;
        if (num) num.textContent = n < 10 ? "0" + n : String(n);
      }
    }

    function clearPrepDrag() {
      var list = document.getElementById("prep-list");
      list.classList.remove("is-reordering");
      var dragged = list.querySelectorAll(".prep-block.dragging");
      for (var i = 0; i < dragged.length; i++) dragged[i].classList.remove("dragging");
      prepDrag = null;
      prepKey = "";
    }

    function prepSongStamp(name) {
      var data = cachedSong(name);
      if (data === undefined) return "?";
      if (!data) return "-";
      var tempo = data.tempoMap && data.tempoMap[0] ? data.tempoMap[0] : {};
      var first = data.sections && data.sections[0];
      var second = data.sections && data.sections[1];
      var count = first && second && sectionTone(first.name || "") === "count" && Number(first.end) > Number(first.start) ? "c" : "";
      return [data.key || "", data.scale || "", data.style || "", data.form || "", data.kita || "", tempo.numerator || "", tempo.denominator || "", tempo.bpm || "", data.duration || "", count].join("/");
    }

    function ensurePrepSongs() {
      var song = selectedSongRow();
      var stopSelected = !!(meta && meta.selStop);
      var seen = {};
      for (var i = 0; i < rows.length; i++) {
        var item = rows[i];
        if (item.k !== "song" || !item.n || seen[item.n]) continue;
        seen[item.n] = true;
        requestSongFile(item.n, !stopSelected && song && item.g === song.g, true);
      }
    }

    function prepFactValues(song, data) {
      var tempo = data && data.tempoMap && data.tempoMap[0] ? data.tempoMap[0] : null;
      return [
        data && data.key ? data.key : "\u2014",
        data && data.scale ? data.scale : "\u2014",
        data && data.style ? data.style : "\u2014",
        data && data.form ? data.form : "\u2014",
        data && data.kita ? String(data.kita) : "\u2014",
        tempo ? ((tempo.numerator || 4) + "/" + (tempo.denominator || 4)) : "\u2014",
        tempo && tempo.bpm ? String(Math.round(tempo.bpm)) : "\u2014",
        data && data.duration ? (clockText(data.duration) || song.d || "\u2014") : (song.d || "\u2014")
      ];
    }

    function appendPrepStat(parent, label, count, seconds, className) {
      var el = document.createElement("span");
      if (className) el.className = className;
      el.appendChild(document.createTextNode(label + ": #" + count + " "));
      var dot = document.createElement("span");
      dot.className = "prep-stat-dot";
      dot.textContent = "\u25cf";
      el.appendChild(dot);
      el.appendChild(document.createTextNode(" " + (clockText(seconds) || "0:00")));
      parent.appendChild(el);
    }

    function prepSetlistStats() {
      var count = 0;
      var total = 0;
      var forms = [];
      var formIndex = {};
      for (var i = 0; i < rows.length; i++) {
        var item = rows[i];
        if (item.k !== "song" || !item.set) continue;
        var seconds = clockSeconds(item.d);
        var data = cachedSong(item.n);
        var form = data && data.form ? data.form : "\u2014";
        count += 1;
        total += seconds;
        if (formIndex[form] == null) {
          formIndex[form] = forms.length;
          forms.push({ name: form, count: 0, total: 0 });
        }
        forms[formIndex[form]].count += 1;
        forms[formIndex[form]].total += seconds;
      }
      return { count: count, total: total, forms: forms };
    }

    function cleanSetlistName(name) {
      return String(name || "").replace(/[\u0000-\u001f]/g, " ").replace(/\s+/g, " ").trim().slice(0, 80);
    }

    function savedSetlistNames() {
      return meta && Array.isArray(meta.setlists) ? meta.setlists : [];
    }

    function prepManage(action) {
      if (!liveNow()) return;
      var select = document.getElementById("prep-setlist-name");
      if (!select) return;
      if (action === "saveas") {
        var seed = select.value || (meta && meta.setlist) || "";
        var typed = window.prompt("Save setlist as", seed);
        if (typed == null) return;
        var name = cleanSetlistName(typed);
        if (!name || name.toLowerCase() === "song library" || savedSetlistNames().indexOf(name) >= 0) return;
        send("savesetlist", name);
        return;
      }
      var current = cleanSetlistName(select.value);
      if (!current || savedSetlistNames().indexOf(current) < 0) return;
      if (action === "overwrite") send("overwritesetlist", current);
      else if (action === "delete") send("deletesetlist", current);
    }

    function prepManageRow() {
      var row = document.createElement("div");
      row.className = "prep-manage";
      var select = document.createElement("select");
      select.id = "prep-setlist-name";
      select.className = "prep-setlist-name";
      select.setAttribute("aria-label", "Song Library");
      select.addEventListener("change", function() {
        var name = cleanSetlistName(select.value);
        var current = meta && meta.setlist ? cleanSetlistName(meta.setlist) : "";
        if (name === current) return;
        if (!liveNow() || stagePlaying()) {
          select.value = current;
          return;
        }
        if (!name) send("clearsetlist");
        else send("loadsetlist", name);
      });
      row.appendChild(select);
      function manageIcon(kind) {
        var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        if (kind === "overwrite") {
          path.setAttribute("d", "M4 16.8V20h3.2l9.7-9.7-3.2-3.2L4 16.8zm11.4-8.2 1.5-1.5a1.1 1.1 0 0 0 0-1.6l-1.4-1.4a1.1 1.1 0 0 0-1.6 0l-1.5 1.5 3 3z");
        } else if (kind === "saveas") {
          path.setAttribute("fill-rule", "evenodd");
          path.setAttribute("d", "M6 3.2h12v17.6H6V3.2zm5.2 4.6h1.6v2.4h2.4v1.6h-2.4v2.4h-1.6v-2.4H8.8V10.2h2.4z");
        } else {
          path.setAttribute("d", "M9.2 4.5h5.6l.7 1.5H19v1.8H5V6h3.5zm1 5.2h1.8v7.2H10.2zm3.8 0h1.8v7.2h-1.8zM7.4 9.7h1.8v9.1h5.6V9.7h1.8v10.9H7.4z");
        }
        svg.appendChild(path);
        return svg;
      }
      function act(label, action, extra) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "prep-manage-act" + (extra ? " " + extra : "");
        btn.title = label;
        btn.setAttribute("aria-label", label);
        btn.setAttribute("data-manage", action);
        btn.appendChild(manageIcon(action));
        btn.addEventListener("click", function(ev) {
          ev.stopPropagation();
          prepManage(action);
        });
        row.appendChild(btn);
      }
      act("Overwrite", "overwrite");
      act("Save as", "saveas");
      act("Delete", "delete", "delete");
      return row;
    }

    function syncPrepManage() {
      var select = document.getElementById("prep-setlist-name");
      if (!select || document.activeElement === select) return;
      var names = savedSetlistNames();
      var named = meta && meta.setlist ? cleanSetlistName(meta.setlist) : "";
      var hasSetSong = false;
      for (var s = 0; s < rows.length; s++) {
        if (rows[s].k === "song" && rows[s].set) {
          hasSetSong = true;
          break;
        }
      }
      var current = hasSetSong && names.indexOf(named) >= 0 ? named : "";
      var sig = names.join("\n") + "\n" + current;
      if (select.getAttribute("data-sig") !== sig) {
        select.setAttribute("data-sig", sig);
        select.innerHTML = "";
        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Song Library";
        empty.selected = true;
        select.appendChild(empty);
        for (var i = 0; i < names.length; i++) {
          var opt = document.createElement("option");
          opt.value = names[i];
          opt.textContent = names[i];
          select.appendChild(opt);
        }
        select.value = names.indexOf(current) >= 0 ? current : "";
      }
      var known = !!select.value && names.indexOf(select.value) >= 0;
      var live = liveNow();
      var row = select.parentNode;
      var overwrite = row.querySelector("[data-manage='overwrite']");
      var saveas = row.querySelector("[data-manage='saveas']");
      var del = row.querySelector("[data-manage='delete']");
      if (overwrite) overwrite.disabled = !live || !known;
      if (del) del.disabled = !live || !known;
      if (saveas) saveas.disabled = !live;
      select.disabled = !live || stagePlaying();
    }

    function appendPrepHead(list) {
      var stats = prepSetlistStats();
      var block = document.createElement("div");
      block.className = "prep-head-block";
      var statsRow = document.createElement("div");
      statsRow.className = "prep-stats";
      appendPrepStat(statsRow, "Total", stats.count, stats.total, "prep-stat-total");
      for (var f = 0; f < stats.forms.length; f++) {
        appendPrepStat(statsRow, stats.forms[f].name, stats.forms[f].count, stats.forms[f].total, "prep-stat-form");
      }
      block.appendChild(statsRow);
      list.appendChild(block);
    }

    function appendCountAct(acts, song, data) {
      var first = data && data.sections && data.sections[0];
      var second = data && data.sections && data.sections[1];
      var countSection = !!(first && second && sectionTone(first.name || "") === "count" && Number(first.end) > Number(first.start));
      var trimmed = countTrim(song);
      var countOn = countSection && !(trimmed > 0);
      var countBtn = document.createElement("button");
      countBtn.type = "button";
      countBtn.className = "prep-act prep-count";
      countBtn.disabled = !(countSection || trimmed > 0);
      countBtn.textContent = "COUNT IN";
      countBtn.setAttribute("data-act", countOn ? "countoff" : "counton");
      if (song.g) countBtn.setAttribute("data-g", song.g);
      countBtn.setAttribute("aria-pressed", countOn ? "true" : "false");
      countBtn.setAttribute("aria-label", "Count in");
      if (!countBtn.disabled) countBtn.title = countOn ? "Start from the beginning" : "Start from the second section";
      if (countOn) countBtn.classList.add("on");
      acts.appendChild(countBtn);
    }

    function ensurePrepManage() {
      if (document.getElementById("prep-setlist-name")) return;
      var panel = document.querySelector(".prep-panel");
      var list = document.getElementById("prep-list");
      if (!panel || !list) return;
      panel.insertBefore(prepManageRow(), list);
    }

    function renderPrep() {
      if (prepDrag) return;
      if (prepHoldOrder) {
        if (setlistGuidOrder() === prepHoldOrder || Date.now() - prepHoldAt > 1500) prepHoldOrder = "";
        else return;
      }
      ensurePrepManage();
      var stopSelected = !!(meta && meta.selStop);
      ensurePrepSongs();
      var seenInfo = {};
      var infoSig = [];
      for (var s = 0; s < rows.length; s++) {
        if (rows[s].k !== "song" || !rows[s].n || seenInfo[rows[s].n]) continue;
        seenInfo[rows[s].n] = true;
        infoSig.push(rows[s].n + "=" + prepSongStamp(rows[s].n));
      }
      var key = rows.map(function(item) {
        return (item.k || "") + (item.g || "") + (item.n || "") + (item.d || "") + (item.set ? "1" : "0") + (item.s ? "s" : "") + (item.c || "");
      }).join(";") + "|" + selectionGuid() + "|" + (stopSelected ? "1" : "0") + "|" + infoSig.join(";");
      if (key === prepKey) {
        syncPrepManage();
        return;
      }
      prepKey = key;
      var list = document.getElementById("prep-list");
      var top = list.scrollTop;
      list.innerHTML = "";
      appendPrepHead(list);
      var libraryStarted = false;
      var number = 0;
      for (var i = 0; i < rows.length; i++) {
        var item = rows[i];
        if (item.k === "song" && !item.set && !libraryStarted) {
          libraryStarted = true;
          var heading = document.createElement("div");
          heading.className = "prep-lib-title";
          heading.textContent = "LIBRARY";
          list.appendChild(heading);
        }
        if (item.k === "final") {
          var finalRow = document.createElement("div");
          finalRow.className = "prep-cols prep-final";
          var finalName = document.createElement("div");
          finalName.className = "prep-cell title";
          finalName.textContent = "CONCERT FINAL";
          finalRow.appendChild(document.createElement("div")).className = "prep-cell num";
          finalRow.appendChild(finalName);
          list.appendChild(finalRow);
          continue;
        }
        var block = document.createElement("div");
        block.className = "prep-block";
        block.setAttribute("data-k", item.k || "");
        if (item.g) block.setAttribute("data-g", item.g);
        if (item.k === "stop" && item.a) block.setAttribute("data-auto", "1");
        if (item.k === "song" && item.set) block.setAttribute("data-set", "1");
        if (item.s) block.classList.add("skipped");
        var selected = false;
        if (item.k === "song") selected = !stopSelected && item.g === selectionGuid();
        if (item.k === "stop") selected = stopSelected && item.g === selectionGuid();
        if (selected) block.classList.add("active");
        var row = document.createElement("div");
        row.className = item.k === "song" ? "prep-cols prep-song-row" : "prep-cols prep-elif-row";
        var num = document.createElement("div");
        num.className = "prep-cell num";
        var title = document.createElement("div");
        title.className = "prep-cell title";
        var songData = item.k === "song" ? cachedSong(item.n) : null;
        if (item.k === "song") {
          if (item.set) {
            number += 1;
            num.textContent = number < 10 ? "0" + number : String(number);
            if (number > 1 && countIsOff(item)) block.appendChild(countOffMark());
          } else num.textContent = "\u2014";
          title.textContent = item.n || "";
        } else {
          title.textContent = "STOP";
        }
        row.appendChild(num);
        row.appendChild(title);
        if (item.k === "song") {
          var values = prepFactValues(item, songData);
          for (var v = 0; v < values.length; v++) {
            var value = document.createElement("div");
            value.className = "prep-val";
            value.textContent = values[v];
            row.appendChild(value);
          }
        }
        var acts = document.createElement("div");
        acts.className = "prep-acts";
        if (item.k === "song") {
          appendCountAct(acts, item, songData);
          if (item.set) {
            acts.appendChild(prepAct("skip", item.g));
            acts.appendChild(prepAct("remove", item.g));
          } else acts.appendChild(prepAct("add", item.g));
        } else if (item.k === "stop") {
          if (!item.a) {
            var stopSkip = prepAct("skipstop", item.g);
            if (item.s) {
              stopSkip.title = "Include";
              stopSkip.setAttribute("aria-label", "Include");
              stopSkip.setAttribute("aria-pressed", "true");
            }
            acts.appendChild(stopSkip);
            acts.appendChild(prepAct("removestop", item.g));
          }
        }
        else acts.appendChild(prepAct("addstop"));
        row.appendChild(acts);
        block.appendChild(row);
        list.appendChild(block);
      }
      syncPrepManage();
      list.scrollTop = top;
    }

    function syncSkipButtons(playing, playGuid, sel, selStop) {

    function markSkipRows(nodes, skipSelector, playing, playGuid, sel, selStop) {
      var playingAt = -1;
      var i;
      if (playing && playGuid) {
        for (i = 0; i < nodes.length; i++) {
          if (nodes[i].getAttribute("data-k") === "song" && nodes[i].getAttribute("data-g") === playGuid) {
            playingAt = i;
            break;
          }
        }
      }
      for (i = 0; i < nodes.length; i++) {
        var skip = nodes[i].querySelector(skipSelector);
        if (!skip) continue;
        var kind = nodes[i].getAttribute("data-k");
        var guid = nodes[i].getAttribute("data-g") || "";

      }

    function libraryKeyText(name) {
      var cached = fileCache[name];
      if (!cached || !cached.settled || !cached.data) return "";

    function libraryRowText(name) {
      var cached = fileCache[name];

    function keyToken(name) {
      var key = libraryKeyText(name);

      try { key = key.toLocaleUpperCase("tr-TR"); } catch (err) { key = key.toUpperCase(); }
      return key;
    }

    function applyAutoStops() {
      var setlist = [];
      var tail = [];
      var inTail = false;
      var i;
      for (i = 0; i < rows.length; i++) {
        var item = rows[i];
        if (!inTail && (item.k === "final" || item.k === "stopadd" || (item.k === "song" && !item.set))) inTail = true;
        if (inTail) tail.push(item);
        else setlist.push(item);
      }
      var songs = [];
      for (i = 0; i < setlist.length; i++) {
        if (setlist[i].k !== "song") continue;
        var stop = null;
        var next = setlist[i + 1];
        if (next && next.k === "stop" && next.g === setlist[i].g) stop = next;
        songs.push({ song: setlist[i], stop: stop });
      }
      var played = [];
      for (i = 0; i < songs.length; i++) {
        if (!songs[i].song.s) played.push(i);
      }
      var needs = {};
      for (i = 0; i < played.length - 1; i++) {
        var left = songs[played[i]].song;
        var right = songs[played[i + 1]].song;
        var ka = keyToken(left.n || "");
        var kb = keyToken(right.n || "");
        if (ka && kb) needs[left.g] = ka !== kb;
      }
      if (played.length) {
        var lastGuid = songs[played[played.length - 1]].song.g;
        if (needs[lastGuid] == null) needs[lastGuid] = false;
      }
      var changed = false;
      for (i = 0; i < songs.length; i++) {
        var entry = songs[i];
        var want = needs[entry.song.g];
        if (entry.song.s && entry.stop && entry.stop.a) {
          entry.stop = null;
          changed = true;
        } else if (want === true && !entry.stop) {
          entry.stop = { k: "stop", g: entry.song.g, a: 1 };
          changed = true;
        } else if (want === false && entry.stop && entry.stop.a) {
          entry.stop = null;
          changed = true;
        }
      }
      if (!changed) return false;
      var rebuilt = [];
      for (i = 0; i < songs.length; i++) {
        rebuilt.push(songs[i].song);
        if (songs[i].stop) rebuilt.push(songs[i].stop);
      }
      rows = withSortedLibrary(rebuilt.concat(tail));
      return true;
    }

    function volToDb(vol) {
      if (!(vol > 0.0000000298)) return -150;
      var db = Math.log(vol) * 8.685889638065037;
      return db < -150 ? -150 : db;
    }

    function dbText(vol) {
      var db = volToDb(vol);
      if (db <= -120) return "-inf";
      var rounded = Math.round(db * 10) / 10;
      if (Math.abs(rounded) < 0.05) return "0.0";
      return (rounded > 0 ? "+" : "") + rounded.toFixed(1);
    }

    function dbToVol(db) {
      if (!(db > -150)) return 0;
      return Math.exp(db * 0.11512925464970229);
    }

    function syncMixTrack() {
      var track = outputPick && outputPick !== "select" ? outputPick : "0";
      wwr_req("SET/EXTSTATE/DBK_STAGE/mixtrack/" + encodeURIComponent(track));
    }

    function clearMixer() {
      receives = [];
      mixerDomKey = "";
      receiveCount = -1;
      receiveParts = ["", "", "", ""];
      renderMixer();
    }

    function flushRecv() {
      if (recvTimer) {
        clearTimeout(recvTimer);
        recvTimer = 0;
      }
      var value = recvPending;
      recvPending = "";
      if (!value) return;
      wwr_req("SET/EXTSTATE/DBK_STAGE/recv/" + encodeURIComponent(value));
    }

    function stepRecv(index, delta) {
      var item = null;
      for (var i = 0; i < receives.length; i++) {
        if (receives[i].i === index) item = receives[i];
      }
      if (!item) return;
      var db = volToDb(item.v);
      var next;
      if (db <= -120) {
        if (delta < 0) return;
        next = -60;
      } else {
        next = db + delta;
        if (next > 12) next = 12;
        if (next < -60) next = -60;
        if (delta < 0 && db <= -60) next = -150;
      }
      var vol = next <= -150 ? 0 : dbToVol(next);
      item.v = vol;
      mixerHold = { i: index, until: Date.now() + 500 };
      var cell = document.querySelector('#mixer-faders [data-i="' + index + '"] .fader-db');
      if (cell) cell.textContent = dbText(vol);
      queueRecv(index, vol);
    }

    function mixStep(direction) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "mix-step mix-" + direction;
      button.setAttribute("aria-label", direction === "up" ? "Up" : "Down");
      var tri = document.createElement("span");
      tri.className = "mix-tri";
      tri.setAttribute("aria-hidden", "true");
      button.appendChild(tri);
      button.addEventListener("click", function(ev) {
        stepRecv(Number(ev.currentTarget.parentNode.getAttribute("data-i")), direction === "up" ? 1 : -1);
      });
      return button;
    }

    function queueRecv(index, vol) {
      if (!outputPick || outputPick === "select") return;
      recvPending = outputPick + "|" + index + "|" + vol.toFixed(6);
      if (recvTimer) return;
      recvTimer = setTimeout(flushRecv, 40);
    }

    function renderMixer() {
      var row = document.getElementById("mixer-faders");
      if (!receives.length) {
        mixerDomKey = "";
        row.innerHTML = '<p class="mixer-empty">No receives</p>';
        return;
      }
      var key = receives.map(function(rec) { return rec.i + ":" + rec.n; }).join("\n");
      if (key !== mixerDomKey) {
        mixerDomKey = key;
        row.innerHTML = "";
        for (var i = 0; i < receives.length; i++) {
          var rec = receives[i];
          var fader = document.createElement("div");
          fader.className = "fader";
          fader.setAttribute("data-i", String(rec.i));
          var name = document.createElement("div");
          name.className = "fader-name";
          name.textContent = rec.n;
          var readout = document.createElement("div");
          readout.className = "fader-db";
          fader.appendChild(name);
          fader.appendChild(readout);
          fader.appendChild(mixStep("up"));
          fader.appendChild(mixStep("down"));
          row.appendChild(fader);
        }
      }
      var nodes = row.querySelectorAll(".fader");
      for (var n = 0; n < nodes.length; n++) {
        var item = null;
        var idx = Number(nodes[n].getAttribute("data-i"));
        for (var r = 0; r < receives.length; r++) {
          if (receives[r].i === idx) item = receives[r];
        }
        if (!item) continue;
        if (mixerHold && mixerHold.i === idx && Date.now() < mixerHold.until) continue;
        nodes[n].querySelector(".fader-db").textContent = dbText(item.v);
      }
    }

    function applyReceives() {
      if (receiveCount < 0) return;
      var text = "";
      var count = Math.max(0, Math.min(4, receiveCount));
      for (var i = 0; i < count; i++) text += receiveParts[i] || "";
      text = text.replace(/\\n/g, "\n");
      var lines = text.split(/\n|;/);
      if ((lines[0] || "") !== String(outputPick || "0")) return;
      var next = [];
      for (var j = 1; j < lines.length; j++) {
        if (!lines[j]) continue;
        var bits = lines[j].split("|");
        if (bits.length < 3) continue;
        var index = parseInt(bits[0], 10);
        var vol = parseFloat(bits[bits.length - 1]);
        if (!isFinite(index) || !isFinite(vol)) continue;
        next.push({ i: index, n: bits.slice(1, bits.length - 1).join("|"), v: vol });
      }
      receives = next;
      renderMixer();
    }

    function selectedOutputName() {
      var select = document.getElementById("outputs");
      var option = select.options[select.selectedIndex];
      var name = option ? String(option.textContent || "") : "";
      try { name = name.toLocaleUpperCase("tr-TR"); } catch (err) { name = name.toUpperCase(); }
      return name.trim();
    }

    function fillOutputs() {
      var select = document.getElementById("outputs");
      var previous = outputPick || select.value;
      select.innerHTML = "";
      if (!outputTracks.length) {
        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "No output";
        select.appendChild(empty);
        select.disabled = true;
        if (outputPick !== "") {
          outputPick = "";
          clearMixer();
        }
        syncMixTrack();
        return;
      }
      select.disabled = false;
      var placeholder = document.createElement("option");
      placeholder.value = "select";
      placeholder.textContent = "<SELECT>";
      select.appendChild(placeholder);
      for (var i = 0; i < outputTracks.length; i++) {
        var track = outputTracks[i];
        var option = document.createElement("option");
        option.value = String(track.i);
        option.textContent = track.n || ("Track " + track.i);
        select.appendChild(option);
      }
      var found = previous === "select";
      if (!found) {
        for (var j = 0; j < outputTracks.length; j++) {
          if (String(outputTracks[j].i) === previous) found = true;
        }
      }
      select.value = found && previous ? previous : "select";
      if (select.value !== outputPick) {
        outputPick = select.value;
        clearMixer();
      }
      syncMixTrack();
    }

    document.getElementById("outputs").addEventListener("change", function() {
      var next = document.getElementById("outputs").value;
      if (next === outputPick) return;
      outputPick = next;
      clearMixer();
      syncMixTrack();
      paint();
    });
    document.getElementById("mixer").addEventListener("click", function() {
      mixerOpen = !mixerOpen;
      if (mixerOpen) renderMixer();
      paint();
    });

    function wwr_onreply(results) {
      var lines = String(results || "").split("\n");
      var songsChanged = false;
      var receiveDirty = false;
      for (var i = 0; i < lines.length; i++) {
        if (!lines[i]) continue;
        var tok = lines[i].split("\t");
        if (tok[0] === "TRANSPORT") {
          playPos = parseFloat(tok[2]) || 0;
          updateHead();
          if (viewPage === "lyrics") markLyrics();
          if (viewPage === "score") markScore();
          if (viewPage === "chords") markChart("chords");
          if (viewPage === "drums") markChart("drums");
          continue;
        }
        if (tok[0] !== "EXTSTATE" || tok[1] !== "DBK_STAGE") continue;
        var raw = tok.slice(3).join("\t");
        if (tok[2] === "meta" && raw !== lastMetaRaw) {
          lastMetaRaw = raw;
          var next = parseJson(raw);
          if (next && next.v === 1) {
            meta = next;
            if (next.off) {
              lastHbChange = 0;
            } else {
              var hb = String(next.hb || "");
              if (hb !== lastHb) {
                lastHb = hb;
                lastHbChange = Date.now();
              }
              if (next.sel) rememberedSel = next.sel;
            }
          }
        } else if (tok[2] === "outputs" && raw !== lastOutputsRaw) {
          var outputs = parseJson(raw);
          if (outputs) {
            lastOutputsRaw = raw;
            outputTracks = outputs;
            fillOutputs();
          }
        } else if (tok[2] === "rn") {
          var count = parseInt(raw, 10);
          if (!isFinite(count)) count = 0;
          if (count !== receiveCount) {
            receiveCount = count;
            receiveDirty = true;
          }
        } else if (/^r[0-3]$/.test(tok[2])) {
          var part = Number(tok[2].charAt(1));
          if (receiveParts[part] !== raw) {
            receiveParts[part] = raw;
            receiveDirty = true;
          }
        } else if (tok[2] === "songs" && raw !== lastSongsRaw) {
          var list = parseJson(raw);
          if (list) {
            lastSongsRaw = raw;
            rows = withSortedLibrary(list);
            songsChanged = true;
          }
        }
      }
      remoteReady = true;
      if (receiveDirty) applyReceives();
      if (songsChanged) render();
      else paint();
    }

    setInterval(paint, 500);
    setInterval(function() {
      if (!practiceMode || (!practicePlaying && !practiceChain)) return;
      followPracticeChain();
      updateHead();
      if (viewPage === "lyrics") markLyrics();
      if (viewPage === "score") markScore();
      if (viewPage === "chords") markChart("chords");
      if (viewPage === "drums") markChart("drums");
    }, 80);
    if (typeof wwr_req !== "function") window.wwr_req = function() {};
    if (typeof wwr_req_recur !== "function") window.wwr_req_recur = function() {};
    if (typeof wwr_start === "function") {
      wwr_start();
      wwr_req_recur("TRANSPORT", 120);
      wwr_req_recur("GET/EXTSTATE/DBK_STAGE/meta;GET/EXTSTATE/DBK_STAGE/songs;GET/EXTSTATE/DBK_STAGE/outputs;GET/EXTSTATE/DBK_STAGE/rn;GET/EXTSTATE/DBK_STAGE/r0;GET/EXTSTATE/DBK_STAGE/r1;GET/EXTSTATE/DBK_STAGE/r2;GET/EXTSTATE/DBK_STAGE/r3", 200);
    } else {
      remoteReady = true;
      paint();
    }
  </script>
</body>
</html>
